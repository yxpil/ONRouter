# 后端韧性的 E2E —— 只服务 tools/resilience_e2e.py，不是示例配置。
#
# 两条独立的故事，各自用独立的 upstream，避免互相污染健康状态：
#   pair     两台后端 + lazy_rejoin 1s。一台被杀掉后：
#               - 用户请求由另一台接住（默认 proxy_next_upstream error,timeout 会换节点）；
#               - 被杀的那台进摘除期，且只在探测间隔到期后由**一次真实用户请求**顺带试探；
#               - 后端恢复后，下一次真实请求成为成功探针，节点自动加回轮询。
#   breaker  单台后端 + circuit_breaker errors=2 window=5s open=2s。
#            连续两次失败后熔断器打开；打开期内不再重试；open 到期后半开探针
#            成功一次即闭合。proxy_next_upstream off 是为了让 502 真的到达客户端
#            （默认的换节点重试会把它藏起来，这是两套机制刻意不同的语义）。
error_log "logs/resilience_e2e_err.log" info;
pid "logs/resilience_e2e.pid";

upstream pair {
    server 127.0.0.1:18401 max_fails=1 fail_timeout=60s;
    server 127.0.0.1:18402 max_fails=1 fail_timeout=60s;
    lazy_rejoin 1s;
}

upstream breaker {
    server 127.0.0.1:18403 max_fails=100 fail_timeout=60s;
    circuit_breaker errors=2 window=5s open=2s;
}

server {
    listen 127.0.0.1:18400;
    server_name resilience.local;

    location = /pair {
        proxy_pass http://pair;
    }

    location = /breaker {
        proxy_next_upstream off;
        proxy_pass http://breaker;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
