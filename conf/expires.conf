# nginx `expires` 的用例配置 —— tools/expires_e2e.py 用
#
# 覆盖四条响应路径：静态文件、反向代理、proxy_cache 命中、Lua（缓冲 + 流式），
# 外加 return 200 与 404（不可缓存状态码必须一字不动）。
# server 级写 `expires 1h`，各 location 用不同写法证明"写了就整条替换、没写才继承"。

error_log "logs/expires_err.log" warn;
pid logs/expires.pid;
worker_threads 2;
gzip off;

proxy_cache_path logs/expires_cache keys_zone=expc:1m max_size=16m;

upstream exporigin { server 127.0.0.1:18585; keepalive 4; }

server {
    listen 127.0.0.1:18584;
    server_name expires.test;
    # 注意：root 是"URI 直接拼在 root 后面"，所以每种写法各有一个真实目录
    root "../public_expires";
    index index.html;
    expires 1h;

    location = /ping { return 200 "pong\n"; }

    # nginx 的 safe_status 里**有 204**：空响应也照样写过期头。
    location = /nocontent { return 204; }

    # 继承 server 的 1h
    location /base/ { index index.html; }

    location /max/    { expires max; }
    location /epoch/  { expires epoch; }
    location /off/    { expires off; }
    location /neg/    { expires -1h; }
    location /text/   { expires "private, no-store"; }
    location /tod/    { expires @23:59:59; }

    # 源站自己带 Cache-Control: max-age=7，网关的策略要盖过它
    location /prox/   { proxy_pass http://exporigin; }

    location /cached/ {
        proxy_pass http://exporigin;
        proxy_cache expc;
        proxy_cache_valid 200 60s;
        expires 30m;
    }

    location = /lua {
        content_by_lua "ngx.say('lua-ok')";
    }

    # 流式：头在第一个 flush 就定型，这条路径最容易漏掉 header filter
    location = /luastream {
        content_by_lua "ngx.header.content_type = 'text/plain'; ngx.say('a'); ngx.flush(); ngx.say('b'); ngx.flush()";
    }

    location = /ret { return 200 "ret-ok\n"; }
}

# 学校/选课站点的一台：没有站点级兜底，所以每条 location 的答案都来自自己那一条。
server {
    listen 18589;
    server_name school.expires.test;
    root "../public_course";
    index index.html;

    location = /ping { return 200 "pong"; }
    location /static/ { expires max; }
    location /login { return 200 "login"; }
    location /api/ { proxy_pass http://exporigin; expires off; }
}

# location 与 server 同时写时由 location 说了算（这里 location 关掉 server 的 30d）
server {
    listen 18590;
    server_name override.expires.test;
    root "../public_course";
    index index.html;
    expires 30d;

    location = /ping { return 200 "pong"; }
    location /off/ { expires off; }
}
