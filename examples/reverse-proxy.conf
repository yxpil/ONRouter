# Reverse proxy with load balancing, passive health checks and timeouts.
#
# Start two demo backends first:
#   python -m http.server 9001 --bind 127.0.0.1
#   python -m http.server 9002 --bind 127.0.0.1
#
#   target/release/onrouter -c examples/reverse-proxy.conf
#   curl -i http://127.0.0.1:18081/api/          # alternates between 9001 and 9002
#   curl -i http://127.0.0.1:18081/health

upstream app {
    least_conn;
    server 127.0.0.1:9001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9002 max_fails=2 fail_timeout=10s;
    keepalive 32;
    # A failed node is probed again by the next real request after this interval.
    lazy_rejoin 5s;
}

server {
    listen 127.0.0.1:18081;
    server_name proxy.example;

    location = /health {
        return 200 "ok\n";
    }

    location /api/ {
        # The trailing slash replaces the matched /api/ prefix on the backend side.
        proxy_pass http://app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
        proxy_pass http://127.0.0.1:9001;
        proxy_read_timeout 10s;
    }
}
