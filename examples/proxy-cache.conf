# Response cache with a request-coalescing lock and revalidation.
#
# Backend: python -m http.server 9001 --bind 127.0.0.1
#   target/release/onrouter -c examples/proxy-cache.conf
#   curl -i http://127.0.0.1:18084/files/      # first MISS, second HIT
#
# The zone lives in memory. Add `disk=on` to the proxy_cache_path line to spill entries
# that are evicted from the keys_zone but still fresh to a cold tier on disk; the next
# request reads them back and promotes them (X-Cache-Tier: disk).

proxy_cache_path "../target/example-cache" keys_zone=pages:16m max_size=256m;

server {
    listen 127.0.0.1:18084;
    server_name cache.example;

    location = /health {
        return 200 "ok\n";
    }

    location /files/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_cache pages;
        proxy_cache_valid 200 60s;
        # One request fills the cache; concurrent requests for the same key wait for it.
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Expired entry: ask the origin with the stored ETag/Last-Modified and replay a 304.
    location /revalidate/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_cache pages;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 30s;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
