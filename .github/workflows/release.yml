name: Cross-Platform Release Builds

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., v0.2.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux builds (x86_64, aarch64, armv7)
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: armv7-unknown-linux-gnueabihf
            archive: tar.gz
          - target: riscv64gc-unknown-linux-gnu
            archive: tar.gz
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            gcc-riscv64-linux-gnu \
            musl-tools
          
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --bin onrouter
          cargo build --release --target ${{ matrix.target }} --bin orr-gencert
      
      - name: Create archive
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar czf ../../../dist/onrouter-${{ github.ref_name }}-${{ matrix.target }}.tar.gz onrouter orr-gencert
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onrouter-linux-${{ matrix.target }}
          path: dist/*.tar.gz

  # 后量子构建。真实动因（2026-10-26 生产事故）：Cloudflare 较新的 zone 回源时 ClientHello
  # 只带 X25519MLKEM768，而本 workflow 之前每个构建都不带 --features pq，于是装了官方 release
  # 产物的网关只能拒绝它 —— CDN 侧表现为 525。能力、断言、文档都早已在仓库里，缺的只是产物。
  # 默认构建保持 ring 不动：开 pq 换的是整个 crypto provider（ring -> aws-lc-rs），由运维选。
  linux-pq:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 与 ci.yml 的 pq job 同一个理由：在 debian:bookworm（glibc 2.36）里编译 aws-lc 的 C 代码，
      # 直接在 ubuntu-24.04（glibc 2.39）上产出的二进制会在 Debian 12 生产机上起不来。
      - name: Build with pq (inside debian:bookworm, glibc 2.36)
        run: |
          docker run --rm -v "$PWD":/work -w /work debian:bookworm bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates build-essential cmake pkg-config perl python3 openssl
            curl --proto "=https" -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release -p onrouter-server --features pq --bin onrouter
            # orr-gencert 只签自签名证书，和入向密钥交换组无关，按默认 feature 出，与其余包一致；
            # 不给它开 pq 是为了不把未验证过的 provider 组合塞进 release。
            cargo build --release -p onrouter-server --bin orr-gencert
            chown -R "$(id -u):$(id -g)" target/release
          '

      - name: Create archive
        run: |
          mkdir -p dist
          cd target/release
          tar czf ../../dist/onrouter-${{ github.ref_name }}-x86_64-unknown-linux-gnu-pq.tar.gz onrouter orr-gencert

      # 文件名里写了 pq 不算数：产物必须自己声明，否则发出去的还是谈不拢 CDN 的那一份。
      - name: pq=on and glibc guard
        run: |
          out=$(./target/release/onrouter -V)
          echo "$out"
          echo "$out" | grep -q '\[pq=on\]' || { echo "::error::release 产物没有报告 pq=on"; exit 1; }
          echo "产物要求的最高 glibc：$(readelf -V ./target/release/onrouter | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onrouter-linux-x86_64-pq
          path: dist/*.tar.gz
  
  # macOS builds (Intel + Apple Silicon)
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
          - target: aarch64-apple-darwin
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --bin onrouter
          cargo build --release --target ${{ matrix.target }} --bin orr-gencert
      
      - name: Create archive
        run: |
          mkdir -p dist
          cd target/${{ matrix.target }}/release
          zip ../../../dist/onrouter-${{ github.ref_name }}-${{ matrix.target }}.zip onrouter orr-gencert
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onrouter-macos-${{ matrix.target }}
          path: dist/*.zip
  
  # Windows builds (x86_64, aarch64)
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            ext: .exe
          - target: aarch64-pc-windows-msvc
            ext: .exe
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} --bin onrouter
          cargo build --release --target ${{ matrix.target }} --bin orr-gencert
      
      - name: Create archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "target/${{ matrix.target }}/release/onrouter${{ matrix.ext }}","target/${{ matrix.target }}/release/orr-gencert${{ matrix.ext }}" -DestinationPath "dist/onrouter-${{ github.ref_name }}-${{ matrix.target }}.zip"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onrouter-windows-${{ matrix.target }}
          path: dist/*.zip
  
  # Create GitHub Release
  release:
    needs: [linux, linux-pq, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Generate checksums
        run: |
          cd artifacts
          # The redirect creates SHA256SUMS.txt before find walks the tree, so exclude it or the
          # file ends up listing its own empty-content hash. Drop the artifact-directory prefix so
          # the paths match the flat asset names on the release and `sha256sum -c` works as-is.
          find . -type f ! -name SHA256SUMS.txt -exec sha256sum {} \; \
            | sed 's|\./[^/]*/||' | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
