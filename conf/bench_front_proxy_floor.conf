# ============================================================
# front_proxy 基准的"门面"网关：一个 front_proxy 块都没有声明的实例，
# location 集合与 conf/bench_front_proxy.conf 的五个 vhost 逐条一致。
#   它回答的是另一半问题：这套缝在"根本没启用"时是不是零成本 ——
#   与 8690（front_proxy_mode off，profile 表在世但一行不跑）对照，
#   才能把"关掉的成本"和"vhost 形状本身的成本"分开。
#   与 bench_ab.conf 同一份静态文件、同一段 Lua 源码字符串、同一组 Python 后端；
#   端口 8695 与 8080 错开，免得和 A/B 套件互相抢监听。
# ============================================================
error_log "logs/bench_fp_floor_err.log" warn;
pid "logs/bench_fp_floor.pid";
access_log "logs/bench_fp_floor_access.log";

upstream demo_backend {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
}

proxy_cache_path /tmp/onrouter_benchfp_floor keys_zone=fpfloor:1m;

server {
    listen 127.0.0.1:8695;
    server_name fp-floor.bench;

    location = /health { return 200 "ok"; }
    location = /bench/hello {
        content_by_lua "ngx.say('hello-from-lua-benchmark') ngx.say('method=', ngx.req.get_method(), ' path=', ngx.var.uri)";
    }
    location = /who {
        content_by_lua "
            ngx.header['X-Fp']          = tostring(ngx.var.front_proxy)
            ngx.header['X-Fp-Verified'] = tostring(ngx.var.front_proxy_verified)
            ngx.header['X-Scheme']      = tostring(ngx.var.scheme)
            ngx.say(ngx.var.remote_addr)
        ";
    }
    location /bench/proxy/ {
        proxy_pass http://demo_backend/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /bench/cached/ {
        proxy_cache fpfloor;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_pass http://demo_backend/;
    }
    location = /metrics { content_by_rust metrics; }
    location / { root "../public"; }
}
