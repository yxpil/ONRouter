# Upgrade 请求的访问控制与隧道生命周期 E2E：
#   * deny / auth_basic / access_by_lua / limit_req 必须在 101 切换之前生效（这是曾经的绕过点）；
#   * 放行后的隧道仍可双向透传；
#   * 隧道空闲超过 proxy_read_timeout 后必须由网关关闭，不能无限占用连接与 limit_conn 额度。
# 端口与其它套件错开（网关 18186，后端在 tools/upgrade_guard_e2e.py 里起在 18187）。
error_log "logs/upgrade_guard_err.log" info;
access_log "logs/upgrade_guard_access.log";

limit_req_zone $remote_addr zone=upg:1m rate=1r/s burst=0;

# max_conns 必须覆盖整条 Upgrade 隧道：隧道存活期间并发额度应一直占用
upstream ws_solo {
    server 127.0.0.1:18187 max_conns=1;
}

server {
    listen 127.0.0.1:18186;
    server_name upgrade.local;

    # 就绪探针：不碰后端
    location /ping {
        return 200 "pong";
    }

    # 正常升级 + 回显；2s 空闲超时
    location /ws/ok {
        proxy_pass http://127.0.0.1:18187;
        proxy_read_timeout 2s;
    }

    # deny all 必须先于 101
    location /ws/deny {
        deny all;
        proxy_pass http://127.0.0.1:18187;
    }

    # auth_basic 必须先于 101
    location /ws/auth {
        auth_basic "Members Only";
        auth_basic_user_file "auth_demo/htpasswd";
        proxy_pass http://127.0.0.1:18187;
    }

    # access_by_lua 拒绝必须先于 101
    location /ws/lua-deny {
        access_by_lua_block {
            return ngx.exit(403)
        }
        proxy_pass http://127.0.0.1:18187;
    }

    # 限流在 PREACCESS，同样必须先于 101：1r/s、burst=0，第二个请求立即 429/503
    location /ws/limited {
        limit_req zone=upg;
        proxy_pass http://127.0.0.1:18187;
    }

    # rewrite 对升级请求同样有效（内部跳转到 /ws/ok 再转发）
    location /ws/rewrite {
        rewrite ^/ws/rewrite$ /ws/ok last;
    }

    # 后端只握手、不说话：用来测隧道空闲超时
    location /ws/hold {
        proxy_pass http://127.0.0.1:18187;
        proxy_read_timeout 2s;
    }

    # 走 max_conns=1 的 upstream：隧道期间额度被占，关闭后释放
    location /ws/up/ {
        proxy_pass http://ws_solo/ws/up/;
        proxy_read_timeout 5s;
    }

    # 同一 upstream 的普通请求：用于观察额度是否被隧道占住
    location /up/plain/ {
        proxy_pass http://ws_solo/ws/plain/;
    }
}
