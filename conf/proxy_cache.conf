# proxy_cache E2E：用真实流量验证响应缓存的命中/未命中/旁路语义——
#   * /c/count：proxy_cache_valid 200 命中的可缓存响应
#       首次 → MISS，后端计数 +1；再次 → HIT，后端计数不变（证明真的走了缓存、没打后端）
#   * /c/cookie：带 Set-Cookie 的响应默认不缓存 → 每次都回源（BYPASS）
#   * /c/nocache：上游 Cache-Control: no-store → 不缓存
#   * /v/*：不同 query 命中不同 cache key
# 端口与其它套件错开（18123），后端在 tools/proxy_cache_e2e.py 里起在 18122。
error_log "logs/proxy_cache_err.log" info;
access_log "logs/proxy_cache_access.log";

server {
    listen 127.0.0.1:18123;
    server_name cache.local;

    # 就绪探针：不碰后端、不进缓存，供 E2E 等待进程起来
    location /ping {
        return 200 "pong";
    }

    # 启用缓存区 "pages"，200 缓存 60s
    location /c/ {
        proxy_pass "http://127.0.0.1:18122/";
        proxy_cache pages;
        proxy_cache_valid 200 60s;
    }

    # proxy_cache_revalidate：条目过期后先带着自己的 ETag 去问一次，
    # 上游答 304 就复用存下来的 body（只重算有效期），不发第二遍内容。
    # 上游 Cache-Control: max-age=2 比这里的 30s 更短 —— 上游说话优先（nginx 同款优先级）。
    location /rv/ {
        # 不带 URI 的 proxy_pass：原样透传 /rv/x，后端的条件请求分支才看得见路径
        proxy_pass "http://127.0.0.1:18122";
        proxy_cache rvzone;
        proxy_cache_revalidate on;
        proxy_cache_valid 200 30s;
    }

    # 同一个 TTL、同一个 ETag，但不开 revalidate 的对照组：过期就只能整份重取
    location /rvn/ {
        proxy_pass "http://127.0.0.1:18122";
        proxy_cache rvzone2;
        proxy_cache_valid 200 30s;
    }

    # 同后端但不启缓存（对照组：每次都打后端）
    location /nocache-proxy/ {
        proxy_pass "http://127.0.0.1:18122/";
    }
}
