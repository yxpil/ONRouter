# 定时访问窗口 E2E：四个窗口、两种闸门落点（location 级与 server 级），见 tools/schedule_e2e.py。
#   office      —— E2E 会把它改写成"下一个真实分钟边界开、几分钟后关"；不改写时是
#                  "每天 09:00–18:00（+08:00）"这条正常配置
#   tzcheck     —— 固定 12:00–13:00（+08:00），**没有任何路由引用**：既用来核对
#                  "算出来的下次触发"换算到 UTC 是不是 04:00Z/05:00Z，也用来触发
#                  "-t 里声明了却没人引用"的告警
#   locked      —— 只在闰年 2/29 00:00 开、3/1 00:00 关：本次测试期间恒为关闭的对照
#   always_open —— 1/1 开、12/31 关：除 12/31 当天外恒为开放，证明闸门不是"一律 403"
# 端口：网关 18330（闸门只写在 location）、网关 18338（闸门写在 server 级，验证继承与
# location 覆盖）、后端 18337（18331-18336 是 router.rs 单测占用，勿改）。
error_log "logs/schedule_err.log" info;
access_log "logs/schedule_access.log";
pid "logs/schedule.pid";
reload 200ms;

schedule_window office { tz +08:00; open "0 9 * * *"; close "0 18 * * *"; }
schedule_window tzcheck { tz +08:00; open "0 12 * * *"; close "0 13 * * *"; }
schedule_window locked { tz UTC; open "0 0 29 2 *"; close "0 0 1 3 *"; }
schedule_window always_open { tz UTC; open "0 0 1 1 *"; close "0 0 31 12 *"; }

server {
    listen 127.0.0.1:18330;
    server_name schedule.local;

    # 就绪探针与看板：这个 server 没有 server 级闸门，所以任何时候都可访问
    location = /ping {
        return 200 "pong";
    }

    location = /metrics {
        content_by_rust metrics;
    }

    # 对照一：没挂闸门的路由，窗口关着也照常回源（默认 off 零代价）
    location /free/ {
        proxy_pass "http://127.0.0.1:18337/";
    }

    # 主角：跟着 office 的日历翻转
    location /office/ {
        schedule_access office;
        proxy_pass "http://127.0.0.1:18337/";
    }

    # 对照二：恒为关闭的窗口，全程 403 且一次都不回源
    location /locked/ {
        schedule_access locked;
        proxy_pass "http://127.0.0.1:18337/";
    }

    # 对照三：恒为开放的窗口，全程 200
    location /any/ {
        schedule_access always_open;
        proxy_pass "http://127.0.0.1:18337/";
    }
}

# 第二个网关：闸门写在 server 级 —— location 不写就继承，写了就以 location 为准。
server {
    listen 127.0.0.1:18338;
    server_name gated.local;

    schedule_access office;

    location /inherited/ {
        proxy_pass "http://127.0.0.1:18337/";
    }

    # location 显式换成恒关的窗口：office 开着时这里也必须 403，证明 location 优先
    location /override/ {
        schedule_access locked;
        proxy_pass "http://127.0.0.1:18337/";
    }
}
