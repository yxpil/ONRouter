# CPU 亲和性 E2E —— 只服务 tools/affinity_e2e.py，不是示例配置。
#
# 显式掩码列表按线程轮换：00000001 -> CPU0，00000002 -> CPU1，第三个线程回到 CPU0。
# 启动日志里的"worker 线程 N 绑定 CPU 核心 [x]"是绑定系统调用返回成功的直接证据。
error_log "logs/affinity_e2e_err.log" info;
pid "logs/affinity_e2e.pid";

worker_threads 3;
worker_cpu_affinity 00000001 00000002;

server {
    listen 127.0.0.1:18410;
    server_name affinity.local;

    location = /ping {
        return 200 "ok";
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
