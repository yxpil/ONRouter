# 业务分流比例（split_clients → proxy_pass 变量）E2E —— 只服务 tools/proxy_split_e2e.py，
# 不是示例配置；示例写法在 conf/proxy_split_examples.conf 与 README。
#
# 这份配置要把四件事分开证明，混在一起就证不出边界在哪：
#   1) 比例本身：50/30/20 的声明比例，落到真实流量上每路的命中数与观察比例一致，
#      且同一个键永远落同一路（粘性）；
#   2) 改投只发生在"这一路给不出一个后端"的时刻（整池在摘除期 / 名字解析不出来）；
#   3) 后端返回 5xx 绝不跨路重投 —— 否则一个 POST 会被打进两个业务版本上，写两次；
#   4) $proxy_split（比例选中的那一路）与 $proxy_split_served（请求真正交给的那一路）
#      可以不同，不同就是串了台，必须能在真实响应头里看见并和 /metrics 对上。
# info 不是随手写的：分流那条启动横幅是 info 级，级别调回 warn 就没有可查的横幅了。
error_log "logs/proxy_split_e2e_err.log" info;
pid "logs/proxy_split_e2e.pid";

# 缓存要和分流一起验：默认缓存键是 $scheme$proxy_host$request_uri，而 $proxy_host
# 用的是插值之后的目标，所以每一路业务各自成条目——灰度版本绝不会读到别的版本的缓存。
proxy_cache_path logs/proxy_split_cache keys_zone=splitcache:1m;

# 三个真实后端：谁接的请求会写在响应体里，脚本据此统计落点
upstream blue {
    server 127.0.0.1:18351;
}
upstream green {
    server 127.0.0.1:18352;
}
upstream grey {
    server 127.0.0.1:18353;
}
# 只会回 500 的一路：证明 5xx 不改投
upstream ver500 {
    server 127.0.0.1:18354;
}
# 整池没人可服务的三种退法。这里刻意不写 `server ... down;`：
# 全 down 的池在 -t 就是错误（配置自己就该说清楚它不可能服务任何请求），
# 所以用"没人监听的端口 + max_fails=1 fail_timeout=60s"来复现运维真实会遇到的形态：
# 第一个请求交给这一路（连接被拒 → 502，同时把节点打进摘除期），
# 第二个请求才轮到"这一路给不出一个后端"，此时 proxy_split_failover 才生效。
# 三个池子指向同一个死地址，但各自的失败计数是独立的（改投互不串）。
upstream deadAuto {
    server 127.0.0.1:18355 max_fails=1 fail_timeout=60s;
}
upstream deadStrict {
    server 127.0.0.1:18355 max_fails=1 fail_timeout=60s;
}
upstream deadExplicit {
    server 127.0.0.1:18355 max_fails=1 fail_timeout=60s;
}
# 0% 那一路的落点实验也要一个"会先接一脚、再变成没人可服务"的池
upstream deadZero {
    server 127.0.0.1:18355 max_fails=1 fail_timeout=60s;
}

# ---- 1) 比例与粘性：以业务侧传来的 X-Key 为粘性键 ----
split_clients "${http_x_key}" $variant {
    50%   blue;
    30%   green;
    20%   grey;
}

# ---- 2) 本意那一路被踢成"给不出后端"：默认（on）改投到下一路 ----
split_clients "${http_x_key}" $deadAuto {
    70%   deadAuto;
    *     blue;
}
# 同一形状，但 proxy_split_failover off：灰度实验要的是"这路没人就是没人"
split_clients "${http_x_key}" $deadStrict {
    70%   deadStrict;
    *     blue;
}
# 显式退路：只允许退到 green，blue 虽然在比例里也不许碰
split_clients "${http_x_key}" $deadExplicit {
    70%   deadExplicit;
    20%   blue;
    10%   green;
}

# ---- 3) 落空：没有 * 兜底，桶值可以是空串 ----
split_clients "${http_x_key}" $noStarOff {
    0.01% blue;
}
split_clients "${http_x_key}" $noStarOn {
    0.01% blue;
}

# ---- 4) 分支写成 host:port（不依赖 upstream 池）----
split_clients "${http_x_key}" $direct {
    50%   127.0.0.1:18351;
    *     127.0.0.1:18352;
}
# 分支指向没人监听的 host:port：连接被拒发生在"已经拿到这一路的地址之后"，
# 归 proxy_next_upstream 管，不许当成"这一路没人"而改投
split_clients "${http_x_key}" $refused {
    50%   127.0.0.1:18356;
    *     127.0.0.1:18351;
}

# ---- 5) 后端 5xx：500 的那一路必须自己扛下这个 500 ----
split_clients "${http_x_key}" $with500 {
    50%   ver500;
    *     blue;
}

# ---- 6) 0% 的那一路：比例永远选不到它，只有改投会走到 ----
# 想把"这套比例之外"的服务当退路，就得这样把它声明进来（改投目标必须是声明过的分支之一）。
# grey 排在 deadZero 前面，所以默认档改投的第一个候选就是它。
split_clients "${http_x_key}" $zeroRoute {
    0%    grey;
    70%   deadZero;
    *     blue;
}

server {
    listen 127.0.0.1:18350;
    server_name split.local;

    # 两个变量随请求头转发给后端，后端原样打回：
    # 这是"网关在把请求交给某一路时到底认为自己在哪一路"的直接证据，
    # 比响应头更硬（502 错误页不带 add_header，照样看得见）。
    location = /split {
        proxy_pass http://$variant;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /auto {
        proxy_pass http://$deadAuto;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /strict {
        proxy_pass http://$deadStrict;
        proxy_split_failover off;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /explicit {
        proxy_pass http://$deadExplicit;
        proxy_split_failover http://green;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /empty-off {
        proxy_pass http://$noStarOff;
        proxy_split_failover off;
    }

    location = /empty-on {
        proxy_pass http://$noStarOn;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /direct {
        proxy_pass http://$direct;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /refused {
        proxy_pass http://$refused;
    }

    location = /zero {
        proxy_pass http://$zeroRoute;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /err500 {
        proxy_pass http://$with500;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /metrics {
        content_by_rust metrics;
    }

    # 缓存命中时请求根本没有交给任何节点：$proxy_split 仍然说得出这是哪一路的缓存，
    # $proxy_split_served 则是空串（add_header 遇空值不输出，响应里就看不到这一行）。
    location = /cached {
        proxy_pass http://$variant;
        proxy_cache splitcache;
        proxy_cache_valid 200 60s;
        add_header X-Cache $upstream_cache_status;
        add_header X-Split $proxy_split;
        add_header X-Split-Served $proxy_split_served;
    }
}
