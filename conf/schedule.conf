# Author: yxpil
# Scheduled access windows E2E: four windows and two gate placements (location level and server level),
# see tools/schedule_e2e.py.
#   office      -- the E2E rewrites this into "opens on the next real minute boundary, closes a few minutes
#                  later"; unwritten it is the ordinary "daily 09:00-18:00" line. +08:00 is the baseline
#                  timezone of this file: every rewritten office block keeps it, and tzcheck's UTC
#                  cross-check is measured against the same offset.
#   tzcheck     -- fixed 12:00-13:00 (+08:00), referenced by NO route: it is there both to cross-check that
#                  the computed next trigger converts to 04:00Z/05:00Z in UTC, and to trigger the "-t"
#                  warning about a window that is declared but referenced by nobody (warn only, still exit 0).
#   locked      -- opens 02-29 00:00 of a leap year, closes 03-01 00:00: a window that is closed for 99% of
#                  the year, so this run always sees it shut and the closed path gets exercised.
#   always_open -- opens 01-01, closes 12-31: open every day of the year except 12-31, which proves the gate
#                  is not "a blanket 403".
# Ports: gateway 18330 (gate written only on locations), gateway 18338 (gate written at the server level, to
# verify inheritance and the location override), backend 18337 (18331-18336 are taken by the router.rs unit
# tests, do not change them).
error_log "logs/schedule_err.log" info;
access_log "logs/schedule_access.log";
pid "logs/schedule.pid";
reload 200ms;

schedule_window office { tz +08:00; open "0 9 * * *"; close "0 18 * * *"; }
schedule_window tzcheck { tz +08:00; open "0 12 * * *"; close "0 13 * * *"; }
schedule_window locked { tz UTC; open "0 0 29 2 *"; close "0 0 1 3 *"; }
schedule_window always_open { tz UTC; open "0 0 1 1 *"; close "0 0 31 12 *"; }

server {
    listen 127.0.0.1:18330;
    server_name schedule.local;

    # Readiness probe and metrics dashboard: this server carries no server-level gate, so it is reachable at
    # any time.
    location = /ping {
        return 200 "pong";
    }

    location = /metrics {
        content_by_rust metrics;
    }

    # Control one: a route with no gate keeps proxying even while a window is closed (default off costs nothing).
    location /free/ {
        proxy_pass "http://127.0.0.1:18337/";
    }

    # The protagonist: flips along with the office calendar.
    location /office/ {
        schedule_access office;
        proxy_pass "http://127.0.0.1:18337/";
    }

    # Control two: a window that is always closed, 403 for the whole run and never one proxy to the backend.
    location /locked/ {
        schedule_access locked;
        proxy_pass "http://127.0.0.1:18337/";
    }

    # Control three: a window that is always open, 200 for the whole run.
    location /any/ {
        schedule_access always_open;
        proxy_pass "http://127.0.0.1:18337/";
    }
}

# The second gateway: the gate is written at the server level -- a location that writes none inherits it, a
# location that writes one overrides it.
server {
    listen 127.0.0.1:18338;
    server_name gated.local;

    schedule_access office;

    location /inherited/ {
        proxy_pass "http://127.0.0.1:18337/";
    }

    # The location explicitly swaps in the always-closed window: while office is open this must still be 403,
    # which proves the location wins over the server.
    location /override/ {
        schedule_access locked;
        proxy_pass "http://127.0.0.1:18337/";
    }
}
