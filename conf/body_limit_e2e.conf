# 请求体上限 E2E（默认 1m / 0=不限 / 流式 chunked 边转边限）
# 端口与其它套件错开（网关 18188，后端在 tools/body_limit_e2e.py 里起在 18189）。
error_log "logs/body_limit_err.log" info;
access_log "logs/body_limit_access.log";

server {
    listen 127.0.0.1:18188;
    server_name body.local;

    location /ping {
        return 200 "pong";
    }

    # 不写 client_max_body_size：按 nginx 默认 1m
    location /buffered/ {
        proxy_pass http://127.0.0.1:18189;
    }

    # 流式路径同样受 1m 约束（chunked 无 Content-Length，只能边转边数）
    location /stream/ {
        proxy_pass http://127.0.0.1:18189;
        proxy_request_buffering off;
    }

    # 显式 0 = 不限制（覆盖 server 默认）
    location /unlimited/ {
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:18189;
        proxy_request_buffering off;
    }

    # 小限额：验证超限帧不会继续塞给后端
    location /small/ {
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:18189;
        proxy_request_buffering off;
    }
}
