# TLS 密钥交换组（supported_groups）边界与握手失败可见性。
# 证书由 tools/tls_groups_e2e.py 生成到 certs_tlsgroups/（已 gitignore）。
#
#   18641 TLS，单一 vhost                     ← 曲线逐个协商：支持的必须成，不支持的必须干净地拒
#   18642 明文 HTTP，暴露 metrics             ← 握手失败必须计入 onrouter_tls_handshake_failures_total
#
# error_log 是 warn：握手失败必须在这一级可见。降到 debug 就等于把"CDN 说源站握手失败、
# 而源站日志一片空白"重新请回来（1.0.3 上线后 Cloudflare 525 就是这么耗掉一小时排查的）。
error_log "logs/tls_groups_err.log" warn;
pid "logs/tls_groups.pid";

server {
    listen 127.0.0.1:18641 ssl;
    server_name g.tls.test;
    ssl_certificate     "../certs_tlsgroups/g.pem";
    ssl_certificate_key "../certs_tlsgroups/g.key";
    location / { return 200 "g\n"; }
}

server {
    listen 127.0.0.1:18642;
    server_name m.tls.test;
    location = /metrics {
        content_by_rust metrics;
    }
    location / { return 404; }
}
