# Rate and concurrency limits keyed by request-phase variables.
#
# One client IP can stand for a whole campus or office behind NAT, so the bucket key is
# often a header, a cookie or a query argument rather than $remote_addr.
#
#   target/release/onrouter -c examples/rate-limit.conf
#   for i in $(seq 1 10); do curl -s -o /dev/null -w "%{http_code}\n" \
#       -H "X-Api-Key: customer-42" http://127.0.0.1:18083/api/; done
#   # first requests 200, then 429 once the burst is spent (a second key gets its own bucket)
#   # limit_req_status / limit_conn_status change the rejection code if you need to.
#
# A request whose key expands to nothing is not limited by that zone.

limit_req_zone  $http_x_api_key      zone=api:1m   rate=5r/s burst=10;
limit_req_zone  $binary_remote_addr  zone=ip:1m    rate=50r/s burst=100;
limit_conn_zone $binary_remote_addr  zone=conn:1m;

server {
    listen 127.0.0.1:18083;
    server_name limits.example;

    location = /health {
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=api;
        limit_conn conn 20;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=ip;
        return 200 "ok\n";
    }
}
