# Canary release: send requests to a whole second upstream by a sticky rule.
#
# Two demo backends:
#   python -m http.server 9001 --bind 127.0.0.1    # stable
#   python -m http.server 9002 --bind 127.0.0.1    # beta
#
#   target/release/onrouter -c examples/canary.conf
#   curl -i -H "Cookie: beta=1" http://127.0.0.1:18085/release   # beta
#   curl -i http://127.0.0.1:18085/release                       # stable or 20% beta
#
# Rules are evaluated in order, first match wins; `percent` hashes a sticky key so the
# same visitor always lands in the same bucket. $proxy_split / $proxy_split_served say
# which branch was chosen and which one actually took the request.

upstream stable {
    server 127.0.0.1:9001 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

upstream beta {
    server 127.0.0.1:9002 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

canary $release "${cookie_uid}${remote_addr}" {
    cookie beta=1 beta;
    header X-Channel=Vip beta;
    percent 20 beta;
    default stable;
}

server {
    listen 127.0.0.1:18085;
    server_name canary.example;

    location = /release {
        proxy_pass http://$release;
        proxy_set_header X-Split        $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
        add_header X-Release $proxy_split;
        add_header X-Release-Served $proxy_split_served;
    }

    location = /health {
        return 200 "ok\n";
    }
}
