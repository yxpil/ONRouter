# 上游响应体超时 / upstream guard 生命周期 E2E 夹具：
#   * /stall/   后端发完响应头后停住 → proxy_read_timeout 到点后断开客户端
#   * /trickle/ 后端每 200ms 发 1 字节、总时长 3s > 读超时 1s → 仍应完整成功
#               （证明超时是"两次读之间的空闲上限"，不是整个响应体的总时长）
#   * /hold/    走 max_conns=1 的 upstream：慢响应体期间 guard 必须仍被持有，
#               第二个请求应 502 no live upstreams；体读完后再放行
#   * /cached/  缓存路径要 collect 整个响应体 → 同样的体超时也要生效（502，不悬挂）
# 端口与其它套件错开（18196），后端在 tools/proxy_body_timeout_e2e.py 里起在 18197。
error_log "logs/proxy_body_timeout_err.log" info;
pid "logs/proxy_body_timeout.pid";
proxy_cache_path /tmp/onrouter_body_to keys_zone=bt:1m;

upstream solo {
    server 127.0.0.1:18197 max_conns=1;
}

server {
    listen 127.0.0.1:18196;
    server_name bt.local;

    location /ping {
        return 200 "pong";
    }

    location /ok/ {
        proxy_pass http://127.0.0.1:18197/ok/;
        proxy_read_timeout 2;
    }

    location /stall/ {
        proxy_pass http://127.0.0.1:18197/stall/;
        proxy_read_timeout 1;
    }

    location /trickle/ {
        proxy_pass http://127.0.0.1:18197/trickle/;
        proxy_read_timeout 1;
    }

    location /hold/ {
        proxy_pass http://solo/hold/;
        proxy_read_timeout 3;
    }

    location /cached/ {
        proxy_pass http://127.0.0.1:18197/stall/;
        proxy_cache bt;
        proxy_cache_valid 200 60s;
        proxy_read_timeout 1;
    }
}
