# 业务分流比例示例（split_clients + proxy_pass http://$变量）—— 抄这份，不要抄代码。
#
# ── 形状 ────────────────────────────────────────────────────────────
# 分流发生在**服务/版本池**这一层，不在节点层：`split_clients` 决定"这一问属于哪一路业务"，
# `proxy_pass` 的**主机位**写那个变量，于是每一路业务是自己的 upstream、自己的健康检查、
# 自己的摘除计数、自己的缓存条目。想按节点分权重，那是 upstream 里的 `weight=`，两件事别混。
#
# ── 唯一不能商量的部分：跨路改投只在"请求还没交给任何节点"时发生 ──────────
# 一旦请求已经发给了某一路的某个节点，成败就归 `proxy_next_upstream` / `error_page` 管，
# **绝不跨路重投**：否则一个 POST 会被打进两个业务版本上，写两次。所以：
#   * 后端返回 5xx → 不跨路（这一路的 500 原样给你的客户端）；
#   * 连不上（被拒/超时）→ 不跨路，这是这一路自己的失败；
#   * 只有"这一路给不出一个可服务的后端"（池不存在、名字解析不出来、桶值为空、
#     全部节点在摘除期内）才会按 `proxy_split_failover` 处置。
# 默认档是 `on`：会改投到声明顺序里的下一路，并在 error log 与 `/metrics` 里记成 `bled`。
# 做灰度实验就把它关成 `off`（下面 /beta 就是这一档）——"这路没人就是没人"，不静默换版本。
#
# ── 粘性键：别用 $remote_addr ────────────────────────────────────────
# 站在 CDN / 公司出口 NAT 后面时 `$remote_addr` 是少数几个网关 IP，全站会被压到同一路，
# 灰度就变成"整站切版本"。键要取**业务身份**：登录态里的 uid、会话 cookie、租户 id，
# 再拼上"这个身份当前该走哪个版本"的开关位（下面是 `${cookie_sid}${http_x_user_bucket}`）。
# 键模板里没值的变量按空串参与拼接，所以带不带头都不会报错，只会挪动落点。
#
# ── 每一路各自成缓存条目 ────────────────────────────────────────────
# 默认 `proxy_cache_key` 是 `$scheme$proxy_host$request_uri`，而 `$proxy_host` 用的是
# **插值之后**的目标，所以同一 URI 在不同业务版本下是两个条目，不会互相读到对方的响应。
# 只有当你自己写了不含目标的 `proxy_cache_key`（例如 `$host$request_uri`）时才会串——
# 那属于配置自己选的，改回来即可。
#
# ── 去哪核对比例 ────────────────────────────────────────────────────
# `location = /metrics` 打开后：
#   onrouter_proxy_split_targets_total{split,target} —— 每一路实际被交出去多少请求，
#     除以这一路的总数就是你该跟运营核对的那张比例表；
#   onrouter_proxy_split_total{split,role} —— routed（按比例交出去）/ bled（改投到别路）/
#     down（这一路给不出后端，按候选次数计）/ empty（桶值为空串）。
#   后端 5xx 不改变上面任何一个数，因为它不跨路。
# 请求级的归属看 `$proxy_split`（比例选中的那一路）与 `$proxy_split_served`（真正接走请求的
# 那一路）：两者不同就是串了台。ONRouter 不实现 `log_format`，本例把它们 `proxy_set_header`
# 到后端回显，便于用一条 curl 看清；也可以把它们写进你自己的日志变量里。

error_log "logs/proxy_split_examples_err.log" warn;
access_log "logs/proxy_split_examples_access.log";
pid "logs/proxy_split_examples.pid";

proxy_cache_path logs/proxy_split_examples_cache keys_zone=releases:2m;

# ---- 三个版本的池：每路业务各自的健康形态与并发额度 ----
upstream app_v1 {
    server 127.0.0.1:18361;
    server 127.0.0.1:18362;
    keepalive 16;
}
upstream app_v2 {
    server 127.0.0.1:18363;
    keepalive 8;
}
upstream app_canary {
    server 127.0.0.1:18364;      # 只放一台：canary 的量本来就小
}

# 这两个池本示例**故意不起后端**（18366 / 18367 没人监听）：/beta 与 /hotfix 都要演示
# "这一路给不出后端"，把它当成你线上某个版本整体挂掉即可。
#
# 为什么是"两个"而不是同一个：节点的健康计数是**按池**算的。同一个池被两条声明共用时，
# 前一条把它打进摘除期，后一条看到的就是"这一路没人可服务"而不是"连不上"，
# 于是两件事在 /metrics 里分不开（一个是 routed+down，一个是直接 bled/down）。
# 想让每个演示各说各话，就各给一个池 —— 线上同理：两个业务的版本池别共用 upstream 名。
upstream app_beta {
    server 127.0.0.1:18366 max_fails=1 fail_timeout=30s;
}
upstream app_gray {
    server 127.0.0.1:18367 max_fails=1 fail_timeout=30s;
}
upstream app_hotfix {
    server 127.0.0.1:18365;
}

# ============================================================
# 声明一：正常灰度。1% canary + 5% v2，其余走 v1。
# ============================================================
split_clients "${cookie_sid}${http_x_user_bucket}" $app_release {
    1%      app_canary;
    5%      app_v2;
    *       app_v1;
}

# ============================================================
# 声明二：beta 实验。30% 走 app_beta，其余 v1 —— 但这一条**不许串台**。
# 灰度实验要的是"命中 beta 的人失败了就是失败"，否则你观测到的错误率是假的
# （失败被悄悄改投到了稳定版，指标上一切正常）。
# ============================================================
split_clients "${cookie_sid}${http_x_user_bucket}" $beta_release {
    30%     app_beta;
    *       app_v1;
}

# ============================================================
# 声明三：把"比例之外的退路"写成 0% 的那一路。
# app_hotfix 不参与比例（0% 永远命中不到），只有 app_gray 整体没人可服务时，
# 默认档的改投才会按声明顺序先走到它。想在比例之外找退路只能这样声明：
# `proxy_split_failover http://x` 的 x 必须是本条 split 声明过的分支之一，`-t` 会核对。
# ============================================================
split_clients "${cookie_sid}${http_x_user_bucket}" $hotfix_release {
    0%      app_hotfix;
    60%     app_gray;
    *       app_v1;
}

server {
    listen 127.0.0.1:18360;
    server_name app.example.test;

    # 归属两个变量随请求带给后端回显：真实流量下"比例选中的路"与"实际接走的路"
    # 是唯一能对着 /metrics 复核的证据。
    location = /whoami {
        proxy_pass http://$app_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location / {
        proxy_pass http://$app_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
        proxy_cache releases;
        proxy_cache_valid 200 30s;
        add_header X-Cache $upstream_cache_status;
        add_header X-Split $proxy_split;
    }

    # 实验档：不串台。app_beta 没人可服务时这一路就 502，绝不悄悄换成 app_v1。
    location = /beta {
        proxy_pass http://$beta_release;
        proxy_split_failover off;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 默认档 + 0% 退路：app_gray 给不出后端时，改投先落到 app_hotfix。
    location = /hotfix {
        proxy_pass http://$hotfix_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 不给分流的写法：目标是写死的字面量，请求路径上连一次插值都不做（一次字符扫描都没有），
    # 配不配分流都不会让它变贵。注意这里**不能**写 proxy_split_failover —— 它一行都不会生效，
    # `-t` 直接拒绝，就是为了不让"看着像有退路"的配置上线。
    location = /admin {
        proxy_pass http://app_v1;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
