# OpenResty API 兼容层 E2E —— 请求/响应 API、body 构造、并发子请求、信号量、
# resty.cookie / resty.limit.*、cosocket 别名与新增 ngx.var。
# 后端由 tools/api_compat_e2e.py 拉起：
#   18201 HTTP echo（回 method / path / query / body / content-length）
#   18202 TCP 行 echo（供 setkeepalive 池复用 + getreusedtimes）
error_log "logs/api_compat_err.log" info;
access_log "logs/api_compat_access.log";

lua_shared_dict api_store 1m;
lua_shared_dict limit_store 1m;

server {
    listen 127.0.0.1:18200;
    server_name api.local;

    # ngx.req.start_time/http_version/is_internal + ngx.worker.*
    location = /meta {
        content_by_lua "
            local pids = ngx.worker.pids()
            ngx.say('start_ok:', ngx.req.start_time() > 0)
            ngx.say('http_version:', ngx.req.http_version())
            ngx.say('internal:', tostring(ngx.req.is_internal()))
            ngx.say('pid:', ngx.worker.pid())
            ngx.say('pids_count:', #pids)
            ngx.say('pid1:', pids[1])
            ngx.say('wid:', ngx.worker.id())
            ngx.say('wcount:', ngx.worker.count())
            ngx.say('exiting:', tostring(ngx.worker.exiting()))
        ";
    }

    # 新增 ngx.var：arg_* / cookie_* / request_body / content_length / https /
    # request_time / msec / server_addr / hostname
    location = /vars {
        content_by_lua "
            ngx.say('arg_a:', tostring(ngx.var.arg_a))
            ngx.say('cookie_sid:', tostring(ngx.var.cookie_sid))
            ngx.say('body:', tostring(ngx.var.request_body))
            ngx.say('cl:', tostring(ngx.var.content_length))
            ngx.say('https:', tostring(ngx.var.https))
            ngx.say('rt:', tostring(ngx.var.request_time))
            ngx.say('msec:', tostring(ngx.var.msec))
            ngx.say('server_addr:', tostring(ngx.var.server_addr))
            ngx.say('hostname_ok:', tostring(ngx.var.hostname ~= nil))
        ";
    }

    # ngx.send_headers + ngx.headers_sent
    location = /send_headers {
        content_by_lua "
            local before = tostring(ngx.headers_sent)
            ngx.send_headers()
            ngx.say('before:', before, ' after:', tostring(ngx.headers_sent))
        ";
    }

    # ngx.eof：结束后的输出必须被丢弃
    location = /eof {
        content_by_lua "
            ngx.say('A')
            ngx.eof()
            ngx.say('B-should-be-dropped')
        ";
    }

    # 构造请求体后转发：init_body / append_body / finish_body
    location = /echo_body {
        rewrite_by_lua "
            ngx.req.set_method('POST')
            ngx.req.init_body(32)
            ngx.req.append_body('hello ')
            ngx.req.append_body('world')
            ngx.req.finish_body()
        ";
        proxy_pass http://127.0.0.1:18201;
    }

    # set_body_data 替换请求体后转发
    location = /echo_set {
        rewrite_by_lua "
            ngx.req.set_method('POST')
            ngx.req.set_body_data('replaced-body')
        ";
        proxy_pass http://127.0.0.1:18201;
    }

    # discard_body：转发空体 + Content-Length: 0
    location = /echo_drop {
        rewrite_by_lua "
            ngx.req.discard_body()
        ";
        proxy_pass http://127.0.0.1:18201;
    }

    location = /echo_direct {
        proxy_pass http://127.0.0.1:18201;
    }

    location = /internal_probe {
        content_by_lua "ngx.say(tostring(ngx.req.is_internal()))";
    }

    # capture 的 method/body/args 选项 + 子请求 internal 语义
    location = /cap_up {
        content_by_lua "
            local res = ngx.location.capture('/echo_direct', {
                method = 'POST',
                body = 'cap-payload',
                args = { x = '1', y = 'two' },
            })
            local inner = ngx.location.capture('/internal_probe')
            ngx.say('status:', res.status)
            ngx.say('body:', res.body)
            ngx.say('internal:', inner.body)
        ";
    }

    location = /slow {
        content_by_lua "ngx.sleep(0.2) ngx.say('s', ngx.var.arg_n)";
    }

    # capture_multi：4 个 200ms 子请求并发，总耗时不应接近 800ms
    location = /cap_multi {
        content_by_lua "
            local t0 = ngx.now()
            local a, b, c, d = ngx.location.capture_multi{
                { '/slow?n=1' }, { '/slow?n=2' }, { '/slow?n=3' }, { '/slow?n=4' },
            }
            local dt = ngx.now() - t0
            ngx.say('bodies:', a.body, ',', b.body, ',', c.body, ',', d.body)
            ngx.say('elapsed:', string.format('%.3f', dt))
        ";
    }

    # ngx.semaphore：线程 sleep 后 post，主协程 wait 被唤醒
    location = /sem {
        content_by_lua "
            local sem = require('ngx.semaphore').new(0)
            local th = ngx.thread.spawn(function()
                ngx.sleep(0.1)
                sem:post()
                return 'posted'
            end)
            local t0 = ngx.now()
            local ok = sem:wait(1)
            local dt = ngx.now() - t0
            local _, thres = ngx.thread.wait(th)
            local timed_out, terr = sem:wait(0.05)
            ngx.say('wait:', tostring(ok))
            ngx.say('woke_after:', string.format('%.2f', dt))
            ngx.say('thread:', tostring(thres))
            ngx.say('timeout:', tostring(timed_out))
            ngx.say('timeout_err:', tostring(terr))
        ";
    }

    # shared dict get_keys / expire
    location = /dict {
        content_by_lua "
            local d = ngx.shared.api_store
            d:flush_all()
            d:set('k1', 'v1', 100)
            d:set('k2', 'v2', 0.02)
            ngx.sleep(0.05)
            local keys, more = d:get_keys(10)
            table.sort(keys)
            ngx.say('keys:', table.concat(keys, ','))
            ngx.say('more:', tostring(more))
            ngx.say('expire_missing:', tostring(d:expire('nope', 10)))
            ngx.say('expire_k1:', tostring(d:expire('k1', 0.02)))
            ngx.sleep(0.05)
            ngx.say('k1_after:', tostring(d:get('k1')))
        ";
    }

    # resty.cookie + ngx.header 表值（多 Set-Cookie）
    location = /cookie {
        content_by_lua "
            local ck = require('resty.cookie'):new()
            local sid = ck:get('sid') or 'none'
            ngx.header['Set-Cookie'] = { 'a=1; Path=/', 'b=2; Path=/' }
            ck:set({ key = 'new', value = 'v', httponly = true })
            ngx.say('sid:', sid)
            ngx.say('multi_type:', type(ngx.header['Set-Cookie']))
            ngx.say('multi_count:', #ngx.header['Set-Cookie'])
        ";
    }

    # resty.limit.count：1 秒窗口 3 次
    location = /limit_count {
        content_by_lua "
            local count = require('resty.limit.count')
            local lim = assert(count:new('limit_store', 3))
            local remaining, err = lim:incoming('e2e', true)
            if not remaining then
                ngx.status = 429
                ngx.say('rejected:', err)
                return
            end
            ngx.say('remaining:', remaining)
        ";
    }

    # resty.limit.req：rate=1/s, burst=0 → 同一时刻第二个请求被拒
    location = /limit_req {
        content_by_lua "
            local req = require('resty.limit.req')
            local lim = assert(req:new('limit_store', 1, 0))
            local delay, err = lim:incoming('e2e-req', true)
            if not delay then
                ngx.status = 429
                ngx.say('rejected:', err)
                return
            end
            ngx.say('delay:', string.format('%.2f', delay))
        ";
    }

    # resty.limit.conn：max=1 并发；持有一段时间后 leaving
    location = /limit_conn {
        content_by_lua "
            local conn = require('resty.limit.conn')
            local lim = assert(conn:new('limit_store', 1, 0))
            local n, err = lim:incoming('e2e-conn', true)
            if not n then
                ngx.status = 429
                ngx.say('rejected:', err)
                return
            end
            ngx.sleep(0.25)
            lim:leaving('e2e-conn')
            ngx.say('conn:', n, ' left:', lim:conn('e2e-conn'))
        ";
    }

    # cosocket：sslhandshake 别名存在 + getreusedtimes 反映池复用
    location = /sock_alias {
        content_by_lua "
            local sock = ngx.socket.tcp()
            sock:settimeout(2000)
            local ok, err = sock:connect('127.0.0.1', 18202)
            if not ok then ngx.say('connect:', err) return end
            local alias_type = type(sock.sslhandshake)
            local reused = sock:getreusedtimes()
            sock:send('probe\\n')
            local line = sock:receive('*l')
            sock:setkeepalive(60, 8)
            ngx.say('alias:', alias_type)
            ngx.say('reused:', reused)
            ngx.say('line:', line)
        ";
    }
}
