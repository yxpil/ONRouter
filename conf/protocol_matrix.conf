# Protocol matrix E2E: one gateway process serving HTTP/1.0, HTTP/1.1,
# HTTP/2 (h2c and TLS ALPN), HTTP/3 (QUIC) plus ws and wss tunnels.
# Author: yxpil
error_log "logs/protocol_matrix_err.log" info;
access_log "logs/protocol_matrix_access.log";

# Plaintext: HTTP/1.0, HTTP/1.1 keep-alive, h2c prior-knowledge, ws.
server {
    listen 127.0.0.1:18570;
    http2 on;
    server_name proto.local;

    location / {
        return 200 "plain-ok\n";
    }
    location = /body {
        content_by_lua "ngx.req.read_body() local b = ngx.req.get_body_data() ngx.say(ngx.req.get_method(), ':', b and #b or 0)";
    }
    location /ws {
        proxy_pass http://127.0.0.1:18573;
    }
}

# TLS: HTTP/1.0 and HTTP/1.1 over TLS, HTTP/2 via ALPN, wss.
server {
    listen 127.0.0.1:18571 ssl http2;
    server_name proto-tls.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";

    location / {
        return 200 "tls-ok\n";
    }
    location /ws {
        proxy_pass http://127.0.0.1:18573;
    }
}

# QUIC: HTTP/3 on UDP; the same port keeps serving HTTP/1.1 and HTTP/2 over TCP.
server {
    listen 127.0.0.1:18572 ssl quic;
    server_name h3.local;
    ssl_certificate     "../certs_scenario/server.pem";
    ssl_certificate_key "../certs_scenario/server.key";

    location / {
        return 200 "h3-tcp-fallback\n";
    }
    location = /hi {
        return 200 "hello-h3\n";
    }
    location = /big {
        content_by_lua 'ngx.header["content-type"] = "text/plain" ngx.say(string.rep("h3-", 5000))';
    }
}
