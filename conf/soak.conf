# 稳定性压测专用 —— 只服务 tools/soak_test.py，不是示例配置。
#
# 挑的是最容易随时间累积内存的几条真实链路：
#   /plain     纯反代 + 连接池/缓冲区churn
#   /wasm      每个请求实例化插件、读写响应头、缓冲并改写响应体
#   /cached    4 MiB 缓存区反复填充/淘汰，键空间远大于容量
#   /lua       每请求建 Lua 执行环境
#   /static    静态文件流式发送 + WASM 过滤器缓冲
# 端口刻意与其它套件错开（18500 网关，18501 后端）。
error_log "logs/soak_err.log" warn;
pid "logs/soak.pid";
worker_threads 4;

proxy_cache_path logs/soak_cache keys_zone=soakcache:4m;

wasm_plugin hf wasm/header_filter.wat;
wasm_plugin bf wasm/body_filter.wat;

upstream soak {
    server 127.0.0.1:18501;
}

server {
    listen 127.0.0.1:18500;
    server_name soak.local;

    location = /ping {
        return 200 "ok";
    }

    location = /plain {
        proxy_pass http://soak;
    }

    location = /wasm {
        header_filter_by_wasm hf;
        body_filter_by_wasm bf;
        proxy_pass http://soak;
    }

    location = /cached {
        proxy_cache soakcache;
        proxy_cache_valid 200 10s;
        proxy_pass http://soak;
        add_header X-Cache $upstream_cache_status;
    }

    location = /lua {
        content_by_lua "ngx.say(string.rep('lua-', 512))";
    }

    location = /static.txt {
        root soak_static;
        header_filter_by_wasm hf;
        body_filter_by_wasm bf;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
