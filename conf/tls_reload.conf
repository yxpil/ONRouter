# TLS 证书热重载 E2E —— 证书文件原地续期，不重启进程、不中断已有连接。
# 证书路径固定；测试期间直接替换 ../certs_tls_reload/server.pem|key。
error_log "logs/tls_reload_err.log" info;
pid "logs/tls_reload.pid";
reload 300ms;

server {
    listen 127.0.0.1:18192 ssl;
    # QUIC 端点与 TCP 共用同一组证书文件，验证 HTTP/3 侧也能热刷新
    listen 127.0.0.1:18193 ssl quic;
    server_name reload.local;
    ssl_certificate     "../certs_tls_reload/server.pem";
    ssl_certificate_key "../certs_tls_reload/server.key";

    location / {
        return 200 "tls-reload-ok\n";
    }
}
