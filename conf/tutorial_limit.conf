# 教程 §12「限流与配额」的可运行示例配置
#
# 一个进程里放四种形状，正好覆盖那章要讲的四个判定：
#   perip    —— 按出口 IP（校园/企业网整栋楼共用一个地址时的默认写法）
#   peruser  —— 按会话 Cookie：同 IP 下两个人各有一个桶
#   perapp   —— 按请求头：没带头的请求在这一维没有值 → 本区不限流，所以用 if 先挡在门外
#   plain / queued —— 同一份 rate 的两条路：超限即拒 vs 有界排队
#
# 核对：python tools/tutorial_limit_check.py  （或照抄 §12.3/§12.4 的 curl）

error_log "logs/tutorial_limit_err.log" info;
pid logs/tutorial_limit.pid;
worker_threads 2;

limit_req_zone $binary_remote_addr zone=perip:1m    rate=50r/s burst=100;
limit_req_zone $cookie_sid         zone=peruser:1m  rate=2r/s  burst=5;
limit_req_zone $http_x_api_key     zone=perapp:1m   rate=50r/s burst=100;
limit_req_zone $cookie_sid         zone=plain:1m    rate=2r/s  burst=0;
limit_req_zone $cookie_sid         zone=queued:1m   rate=2r/s  burst=0;
limit_req_queue queued depth=20 depth_min=20 max_delay=3000ms;

server {
    listen 18650;
    server_name limit.test;

    location = /ping { return 200 "pong"; }

    location /api/order/ {
        limit_req zone=peruser;
        return 200 "ok";
    }

    # 没带头的调用方先挡在门外，否则这一维上"没有键"= 完全不受约束
    location /api/public/ {
        if ($http_x_api_key = "") {
            return 401 "need api key\n";
        }
        limit_req zone=perapp;
        return 200 "ok";
    }

    # 同一份 rate=2r/s burst=0：一条超限即拒，一条有界排队
    location /api/plain/  { limit_req zone=plain;  return 200 "ok"; }
    location /api/queued/ { limit_req zone=queued; return 200 "ok"; }

    location / {
        limit_req zone=perip;
        return 200 "ok";
    }
}
