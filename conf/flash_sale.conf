# 大促 / 闪购业务形状 —— tools/flash_sale_e2e.py 的用例配置
#
# 一台扛大促的网关上，真正会死人的不是"某条指令没生效"，而是这几件事：
#   * 热点商品详情在 TTL 到期的那一刻被几千人同时要打 → 击穿源站；
#   * 下单是非幂等的 POST，超时后**重放到第二个后端就是重复下单**；
#   * 库存不能超卖一；
#   * 优惠券接口在大促瞬间要打几十万请求，限流必须"按人"而不是"按出口 IP"
#     （一个小区出口后面是几千人）；
#   * 一台后端被压死时，剩下的要顶住，恢复后要能回来。
# 每一条都配了业务底线级别的断言，不是"200 对不对"。

error_log "logs/flash_sale_err.log" info;
pid logs/flash_sale.pid;
worker_threads 4;

# 按会话限流：同 IP 的不同人各自独立计数（键的取值见 OPERATIONS §5.2）
limit_req_zone $cookie_sid zone=coupon:1m rate=2r/s burst=5;
limit_req_zone $cookie_sid zone=cq:1m    rate=2r/s burst=5;
limit_req_queue cq depth=20 depth_min=20 max_delay=3000ms;

proxy_cache_path logs/flash_cache keys_zone=sku:64k max_size=32m;

# 下单的两个后端：A 故意慢（睡 3s，制造"请求已经发出去了才超时"），B 正常
upstream orders {
    server 127.0.0.1:18631 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:18632;
}

server {
    listen 18630;
    server_name sale.test;

    location = /ping { return 200 "pong"; }
    location = /metrics { content_by_rust metrics; }

    # 商品图与前端资源：文件名带哈希，缓存一年
    location /assets/ {
        root "../public_flash";
        expires max;
    }

    # 热点商品详情：单 key、锁住回源
    location /api/hot {
        proxy_pass http://127.0.0.1:18633/api/hot;
        proxy_cache sku;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        proxy_cache_key "$uri";
        add_header X-Cache $upstream_cache_status;
        expires 5s;
    }

    # 库存长轮询：后端挂 1.2s 再答，测"并发挂着的连接没有把额度吃光也没被串行化"
    location = /api/stock-poll {
        proxy_pass http://127.0.0.1:18633/api/stock-poll;
        proxy_read_timeout 5s;
    }

    # 下单：非幂等 POST。`error timeout` 是 nginx 的默认值；`http_502 http_503` 是业务要的——
    # 一台后端被压死时它回的 503 也算一次失败尝试，既要换节点，也要计入 max_fails 把它摘掉。
    # 但对 POST/LOCK/PATCH 这类非幂等方法，请求一旦交到某个后端就不许再换一台重发——
    # 否则用户被扣两次库存。显式写出来，是为了让 `non_idempotent`（那个"允许重发"的开关）
    # 在 diff 里一眼可见，而不是靠默认值。
    location /api/order {
        proxy_pass http://orders;
        proxy_read_timeout 1s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # 秒杀扣库存：只有一个权威后端（两处各一份库存账就没法判"不超卖"）
    location /api/seckill {
        proxy_pass http://127.0.0.1:18634;
    }

    location /api/coupon {
        limit_req zone=coupon;
        proxy_pass http://127.0.0.1:18633/api/coupon;
    }

    location /api/coupon_q {
        limit_req zone=cq;
        proxy_pass http://127.0.0.1:18633/api/coupon;
    }
}
