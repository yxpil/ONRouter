# /metrics E2E：用真实流量验证运行时指标端点（Prometheus 文本 + 活跃连接 gauge +
# 状态码分类计数）。端口与其它套件错开。
error_log "logs/metrics_err.log" info;

server {
    listen 127.0.0.1:18113;
    server_name metrics.local;

    location /health {
        return 200 "ok";
    }

    # 制造 4xx 流量
    location /notfound {
        return 404 "nope";
    }

    # 快速路径计数：无让出的 Lua 阶段（首段在请求任务内直接跑完）
    location = /lua-inline {
        content_by_lua_block { ngx.say("inline-ok") }
    }

    # 有让出的 Lua 阶段（首段 inline，随后协程移交调度器）
    location = /lua-sleep {
        content_by_lua_block { ngx.sleep(0.005) ngx.say("slept") }
    }

    # 指标端点：Rust 原生处理器读取进程级 metrics 单例并渲染
    location /metrics {
        content_by_rust metrics;
    }
}
