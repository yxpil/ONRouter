# QUIC / HTTPS 业务形状 E2E —— tools/quic_business_e2e.py 用
#
# 一个 vhost 同时挂在 TCP-TLS（h1.1 与 h2，ALPN 协商）与 UDP（h3）上，跑同一套业务：
# 静态站、缓存热键、按会话限流、POST 下单、SSE 流式、大响应、上游超时。
# 目的不是"h3 能不能握手"（那条 http3_e2e 已经管），而是**同一条业务在三种传输上
# 看到的是不是同一套行为**：缓存与限流的账是不是同一本、字节是不是同一份、状态码是不是同一个。
#
# 端口 18155（TCP+UDP 同号）/ 18159（源站）；18160 是"死端口"（本套件不监听它）。

error_log "logs/qbiz_err.log" info;
pid logs/qbiz.pid;
worker_threads 2;

proxy_cache_path logs/qbiz_cache keys_zone=qb:8m max_size=32m;

limit_req_zone $cookie_sid zone=sid:1m rate=2r/s burst=5;

# gzip 是 http 级指令：写在 server/location 里会被点名"未知指令"，压缩静默不发生
gzip on;
gzip_min_length 64;
gzip_types text/plain text/css application/javascript;

upstream qborigin {
    server 127.0.0.1:18159;
    keepalive 8;
}

server {
    # 三种传输挂在同一个端口号上：TCP-TLS 上 h1.1 与 h2（要显式写 http2，口径同 nginx：
    # `quic` 只带来 UDP 上的 HTTP/3，不会顺手把 TCP 侧也升级成 h2），UDP 上 h3
    listen 127.0.0.1:18155 ssl http2 quic;
    server_name localhost;

    ssl_certificate     "../certs_qbiz/server.pem";
    ssl_certificate_key "../certs_qbiz/server.key";

    root "../public_qbiz";
    index index.html;

    # 静态站的根：ONRouter 不会在没有匹配 location 的情况下去碰 root，必须显式开一条
    location / {
        index index.html;
    }

    location = /ping { return 200 "pong\n"; }
    location = /metrics { content_by_rust metrics; }

    # 静态：expires + 条件请求 + Range 都必须在三种传输上一致
    location /assets/ {
        expires 30d;
    }

    # 热点详情：单 key、共享缓存。三种传输必须打穿到同一本账上
    location /api/hot {
        proxy_pass http://qborigin/api/hot;
        proxy_cache qb;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$uri";
        add_header X-Cache $upstream_cache_status;
        expires 60s;
    }

    # 可分键的热点：`?n=<批次>` 让惊群测试能拿到一个"全新的 key"，
    # 而不必靠重启或等过期来制造 MISS
    location /api/hotn {
        proxy_pass http://qborigin/api/hot;
        proxy_cache qb;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$uri$arg_n";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        add_header X-Cache $upstream_cache_status;
    }

    # 下单：POST 请求体要按字节交到源站
    # 诊断用：让网关自己说"我收到了多少请求体字节"（Lua 读的是服务层缓冲下来的 body）
    location = /api/lenlua {
        content_by_lua '
            local d = ngx.req.get_body_data()
            ngx.header["content-type"] = "text/plain"
            ngx.say("body=" .. (d and tostring(#d) or "nil"))
        ';
    }

    # 诊断用：把网关"看到的请求长度"回显出来，用来分清是"客户端没发"还是"网关没转发"
    location = /api/len {
        add_header X-Req-Len $request_length;
        add_header X-Body-Len $body_bytes_sent;
        return 200 "ok\n";
    }

    location /api/order {
        proxy_pass http://qborigin/api/order;
        proxy_read_timeout 5s;
    }

    # 状态长轮询：代理响应体默认逐帧转发（ONRouter 没有 proxy_buffering 这条指令，
    # 也就没有"先缓冲整份"这条路），判定交给客户端看到的帧到达时刻
    location /api/stream {
        proxy_pass http://qborigin/api/stream;
        proxy_read_timeout 10s;
    }

    # 2 MB 大响应：h3 要走完多包/重组这条路径
    location /api/big {
        proxy_pass http://qborigin/api/big;
        proxy_read_timeout 10s;
    }

    # 按会话限流：跨传输共享同一个桶
    location /api/limited {
        limit_req zone=sid;
        proxy_pass http://qborigin/api/limited;
    }

    # 上游超时：三种传输都应当拿到 504（口径同 nginx）
    location /api/slow {
        proxy_pass http://qborigin/api/slow;
        proxy_read_timeout 1s;
        proxy_next_upstream off;
    }

    # 上游连不上：三种传输必须给出**同一个**码（本机回环上是 502 还是 504 由主机决定）
    location /api/dead {
        proxy_pass http://127.0.0.1:18160;
        proxy_connect_timeout 1s;
        proxy_next_upstream off;
    }
}
