# 游戏服务器的 UDP 业务形状 —— tools/game_udp_e2e.py 的用例配置
#
# 一台游戏前置的真实形状是这样的：
#   * 心跳/状态上报：客户端以 10–30 Hz 猛发，服务端不回包 → `proxy_responses 0`
#   * 房间/战斗服：一问一答，延迟敏感，一个客户端 = 一条长期"伪连接" → 默认 proxy_responses 1
#   * 登录/匹配：一问多答（一条请求回若干帧）→ proxy_responses 4
# 全部走 UDP。这里同时监听一个相同端口号的 TCP 服务，证明两条栈互不干扰。

error_log "logs/game_udp_err.log" info;
pid logs/game_udp.pid;
worker_threads 4;
# 会话 = 一条 socket = 一个 fd，所以 UDP 会话与 HTTP/stream 共用这个额度。
# 故意设小，用来把"额度用尽时丢包并计数"这条路走出来（而不是把进程拖到 EMFILE）。
worker_connections 256;

upstream rooms {
    server 127.0.0.1:18611;
    server 127.0.0.1:18612;
}

# 七层：只放指标与健康检查，用来证明额度被 UDP 吃满时 HTTP 仍在服务
server {
    listen 18610;
    server_name game.test;

    location = /metrics { content_by_rust metrics; }
    location = /ping { return 200 "pong"; }
}

stream {
    # 心跳/状态上报：不等回包，不建会话、不占 fd
    server {
        listen 18613 udp;
        proxy_pass 127.0.0.1:18621;
        proxy_responses 0;
        proxy_timeout 5s;
    }

    # 房间服：一问一答，按客户端 4 元组维持会话；两个节点轮流承接
    server {
        listen 18614 udp;
        proxy_pass rooms;
        proxy_timeout 2s;
    }

    # 匹配服：一问多答（一条请求回若干帧）
    server {
        listen 18615 udp;
        proxy_pass 127.0.0.1:18623;
        proxy_responses 4;
        proxy_timeout 2s;
    }

    # 会话回收：空闲 1 秒即回收，用来数"会话复用"而不是"每包一个会话"。
    # 同时给一个每监听点的会话上限：源地址可伪造的洪水不该吃光 worker_connections。
    server {
        listen 18616 udp;
        proxy_pass 127.0.0.1:18622;
        proxy_timeout 1s;
        udp_max_sessions 32;
    }

    # 对照：不设上限的那条，也就是 nginx 的默认形状。
    # 用例最后拿它把"饿死"量出来（然后清场），所以这条不是装饰。
    server {
        listen 18617 udp;
        proxy_pass 127.0.0.1:18622;
        proxy_timeout 2s;
    }

    # 同一个端口号上的 TCP 服务：与上面的 UDP 入口互不干扰
    server {
        listen 18613;
        proxy_pass 127.0.0.1:18624;
    }
}
