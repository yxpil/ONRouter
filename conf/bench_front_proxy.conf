# ============================================================
# front_proxy 性能基准专用配置
#   四个形状完全相同的 vhost，只差 front_proxy_mode 一档 —— 这样两张表之间
#   唯一变化的就是被测代码路径，rps 差就是这条缝的每请求成本。
#     8690 off     连看都不看这些头（默认档，也是"功能在但关掉"的对照）
#     8691 detect  只识别 + 标注，一个值都不改写
#     8692 egress + auto_trust on   全量改写：地址/协议/国家/Host + Cache-Status
#     8693 egress，auto_trust 默认 off  认得出、采来源元数据，地址不动
#     8694 egress + auto_trust on   但请求不带任何能力头（探针不命中）——
#            代表 egress vhost 上最常见的那部分流量：不是从 CDN 来的
#   基准侧还有一个"完全没有 front_proxy 块"的门面网关跑在 8080（conf/bench_ab.conf），
#   用来区分"这条缝的成本"和"这套 vhost 形状本身的成本"。
#   与 bench_ab.conf 对齐：同一份静态文件、同一段 Lua 源码字符串、同一组 Python 后端。
#   端口 8690-8694 与其它套件（18380+/8090+/9001/9002）错开。
# ============================================================
error_log "logs/bench_front_proxy_err.log" warn;
pid "logs/bench_front_proxy.pid";
access_log "logs/access.log";

upstream demo_backend {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
}

proxy_cache_path /tmp/onrouter_benchfp keys_zone=fpbench:1m;

# 编造的一家代理（引擎里零厂商名；真实部署时头名照抄它家文档，网段现取）
front_proxy bench-edge {
    probe X-Bench-Edge-Id ~ edge;
    probe X-Bench-Edge-Ray;
    ip_header X-Bench-Real-Client;
    ip_header X-Forwarded-For;
    country_header X-Bench-Edge-Country;
    proto_header   X-Bench-Visitor;
    host_header    X-Forwarded-Host;
    trust 127.0.0.0/8;
}

# ---- 每个 vhost 的 location 集合必须逐条一致，否则比的就不是模式 ----
# = /health         return 200，最短路径
# = /bench/hello    与 bench_ab.conf 完全同一字符串的 Lua
# = /who            证明被测支路真的跑了：回显改写后的地址/协议/标注
# /bench/proxy/     反代到 Python 后端
# /bench/cached/    proxy_cache 命中（缓冲响应路径，Cache-Status 只在这条上出）
# = /metrics        计数快照，只在基准脚本的取证明前后抓，不参与计时
# /                 静态兜底

server {
    listen 127.0.0.1:8690;
    server_name fp-off.bench;
    front_proxy_mode off;

    location = /health { return 200 "ok"; }
    location = /bench/hello {
        content_by_lua "ngx.say('hello-from-lua-benchmark') ngx.say('method=', ngx.req.get_method(), ' path=', ngx.var.uri)";
    }
    location = /who {
        content_by_lua "
            ngx.header['X-Fp']          = tostring(ngx.var.front_proxy)
            ngx.header['X-Fp-Verified'] = tostring(ngx.var.front_proxy_verified)
            ngx.header['X-Fp-Country']  = tostring(ngx.var.front_proxy_country)
            ngx.header['X-Scheme']      = tostring(ngx.var.scheme)
            ngx.say(ngx.var.remote_addr)
        ";
    }
    location /bench/proxy/ {
        proxy_pass http://demo_backend/;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /bench/cached/ {
        proxy_cache fpbench;
        proxy_cache_valid 200 1h;
        proxy_cache_key "$scheme$host$request_uri";
        proxy_pass http://demo_backend/;
    }
    location = /metrics { content_by_rust metrics; }
    location / { root "../public"; }
}

