version: '3.8'

services:
  onrouter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onrouter-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount configuration directory
      - ./conf:/app/conf:ro
      # Mount certificates for TLS
      - ./certs:/app/certs:ro
      # Persist logs
      - onrouter-logs:/app/logs
      # Branding assets (logo)
      - ./public:/app/public:ro
    environment:
      # Optional: Override config path
      - ONROUTER_CONFIG=/app/conf/onrouter.conf
      # Optional: Log level
      - RUST_LOG=info
    networks:
      - onrouter-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a demo backend service
  demo-backend:
    image: nginx:alpine
    container_name: onrouter-demo-backend
    restart: unless-stopped
    volumes:
      - ./demo/html:/usr/share/nginx/html:ro
    networks:
      - onrouter-net
    expose:
      - "80"

volumes:
  onrouter-logs:
    driver: local

networks:
  onrouter-net:
    driver: bridge
