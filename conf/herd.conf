# 惊群（cache stampede / 同键并发洪峰）用例配置 —— tools/herd_e2e.py 用
#
# 四条路各自代表一种"同一个热点在同一刻被很多人要"的形状：
#   /nolock/   没有写 proxy_cache_lock（走默认值）——默认值与 nginx 是否一致，用数字说话
#   /lock/     proxy_cache_lock on，锁住的单飞
#   /timeout/  lock on + 300ms 等待预算，而回源要 1.2s：超时分支
#   /cold/     小 keys_zone + disk=on：条目先被淘汰进冷层、再在冷层里过期，然后 40 并发
#   /limit/    一个键 200 并发打 rate=1r/s burst=0：限流桶在极端争用下能不能不多放

error_log "logs/herd_err.log" warn;
pid logs/herd.pid;
worker_threads 4;

proxy_cache_path logs/herd_mem keys_zone=mem:64k max_size=16m;
# spill_after=0：这条路径要判的是冷层里的过期瞬间，被淘汰下来的一定要落盘
proxy_cache_path logs/herd_cold keys_zone=cold:1k disk=on max_size=16m max_value=1m spill_after=0;

limit_req_zone $http_x_herd zone=herd:1m rate=1r/s burst=0;

upstream herdorigin { server 127.0.0.1:18594; keepalive 64; }

server {
    listen 127.0.0.1:18593;
    server_name herd.test;

    location = /ping { return 200 "pong"; }
    location = /metrics { content_by_rust metrics; }

    # 默认（不写 lock）
    location /nolock/ {
        proxy_pass http://herdorigin/api/;
        proxy_cache mem;
        proxy_cache_valid 200 30s;
        add_header X-Cache $upstream_cache_status;
    }

    location /lock/ {
        proxy_pass http://herdorigin/api/;
        proxy_cache mem;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache $upstream_cache_status;
    }

    # 等待预算远小于回源耗时：超时之后该怎么办，必须是可观察的
    location /timeout/ {
        proxy_pass http://herdorigin/slow/;
        proxy_cache mem;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 300ms;
        add_header X-Cache $upstream_cache_status;
    }

    # 冷层：条目被挤出内存后落到 disk，再在冷层里过期
    location /cold/ {
        # 快源站：filler 要是每条都让后端睡 0.6s，24 条跑完 k4 早就过期了，
        # 测到的就不是"冷层里的过期瞬间"而是内存未命中
        proxy_pass http://herdorigin/fast/;
        proxy_cache cold;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache $upstream_cache_status;
    }

    location /limit/ {
        limit_req zone=herd;
        proxy_pass http://herdorigin/api/;
    }
}
