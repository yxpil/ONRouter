# 教程完整示例 —— 对应 docs/TUTORIAL.md 第 12 章。
#
# 需要两个后端（只是一个回显名字的小脚本，不是生产代码）：
#   python tools/tutorial_backend.py a 18601
#   python tools/tutorial_backend.py b 18602
#
# 覆盖：静态文件、反向代理、lazy rejoin、熔断、缓存、canary、
#       WASM access/header_filter、Lua、/metrics。
# 绑定 127.0.0.1:18600，只用于本机练习。
error_log "logs/tutorial_err.log" info;
pid "logs/tutorial.pid";
access_log "logs/tutorial_access.log";
reload 2s;
worker_threads 2;

proxy_cache_path logs/tutorial_cache keys_zone=tutorial:16m;
# 磁盘冷层的教学区：keys_zone 只有 8 条容量，所以第 9 个 URL 就会把第 1 条挤到磁盘上，
# 再请求第 1 个 URL 能看到 X-Cache-Tier: disk 且后端计数不变（见 TUTORIAL §5）。
proxy_cache_path logs/tutorial_cold keys_zone=cold:1k disk=on max_size=32m max_value=1m;

upstream stable {
    server 127.0.0.1:18601 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

upstream beta {
    server 127.0.0.1:18602 max_fails=2 fail_timeout=5s;
    keepalive 16;
}

upstream app {
    server 127.0.0.1:18601 max_fails=1 fail_timeout=60s;
    server 127.0.0.1:18602 max_fails=1 fail_timeout=60s;
    lazy_rejoin 2s;
    keepalive 16;
}

upstream breaker {
    server 127.0.0.1:18602 max_fails=100 fail_timeout=60s;
    circuit_breaker errors=2 window=5s open=2s;
}

canary $release "${cookie_uid}${remote_addr}" {
    cookie beta=1 beta;
    header X-Channel=Vip beta;
    ua ~* (Firefox|Edg) beta;
    os ios beta;
    percent 20 beta;
    default stable;
}

wasm_plugin authz wasm/authz.wat;
wasm_plugin hf wasm/header_filter.wat;

lua_shared_dict tutorial 1m;

server {
    listen 127.0.0.1:18600;
    server_name tutorial.local;

    location = /health {
        return 200 "ok";
    }

    # 灰度入口：$release 由 canary 规则决定，落到 stable 或 beta
    location = /release {
        proxy_pass http://$release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 两台后端轮询；一台挂掉由另一台接住，lazy_rejoin 到点后用真实请求探活
    location /api/ {
        proxy_pass http://app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout;
    }

    location = /pair {
        proxy_pass http://app;
    }

    # 单台后端 + 熔断；关掉换节点重试，让 502 真的到客户端
    location = /breaker {
        proxy_next_upstream off;
        proxy_pass http://breaker;
    }

    # 缓存按灰度目标分别成条目，stable 与 beta 不会互相读到对方的页面
    location = /cached {
        proxy_cache tutorial;
        proxy_cache_valid 200 10s;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://$release;
        proxy_set_header X-Split $proxy_split;
    }

    # 磁盘冷层：8 条内存 + disk=on，被淘汰的新鲜响应落盘，再读回来仍是 HIT（不打后端）
    location = /cold {
        proxy_cache cold;
        proxy_cache_valid 200 10m;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://app;
    }

    # WASM access：没有 X-Gateway-Token 直接 403，后端一次都不会被访问
    location = /guarded {
        access_by_wasm authz;
        proxy_pass http://app;
    }

    # WASM header_filter：改状态码、加标记头、删掉上游的内部头
    location = /filtered {
        header_filter_by_wasm hf;
        proxy_pass http://app;
    }

    location = /lua {
        content_by_lua "ngx.say('hello from lua, path=', ngx.req.get_path())";
    }

    location = /lua/count {
        content_by_lua "
            local d = ngx.shared.tutorial
            local n, err = d:incr('hits', 1, 0)
            if not n then ngx.say('incr failed: ', err) return end
            ngx.header['Content-Type'] = 'text/plain; charset=utf-8'
            ngx.say('hits=', n)
        ";
    }

    location / {
        root "../public";
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
