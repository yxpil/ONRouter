# ngx.timer 回调协程化 E2E：回调里可用 ngx.sleep / cosocket / ngx.location.capture /
# ngx.thread.spawn+wait（与请求协程同一套 yield-op 唤醒机制）。
# 端口与其它套件错开：网关 18250，后端由 tools/lua_timer_e2e.py 起在 18251。
error_log "logs/lua_timer_err.log" info;
access_log "logs/lua_timer_access.log";

lua_shared_dict timer_state 1m;

server {
    listen 127.0.0.1:18250;
    server_name timer.local;

    location /ping {
        return 200 "pong";
    }

    # 客户端请求立即返回；真正的活由 0 延迟定时器在后台协程里做。
    location /timer/start {
        content_by_lua_block {
            local d = ngx.shared.timer_state
            d:flush_all()
            local ok, err = ngx.timer.at(0, function(premature)
                d:set("phase", ngx.get_phase())

                -- 1) 让出：定时器协程必须能跑 ngx.sleep
                ngx.sleep(0.15)
                d:set("slept", "yes")

                -- 2) cosocket：真实 TCP 往返（后端 18251）
                local sock = ngx.socket.tcp()
                sock:settimeout(3000)
                local cok, cerr = sock:connect("127.0.0.1", 18251)
                if not cok then
                    d:set("cosocket", "connect:" .. tostring(cerr))
                else
                    sock:send("GET /timer-cosocket HTTP/1.0\r\nHost: backend\r\n\r\n")
                    local data, rerr = sock:receive("*a")
                    sock:close()
                    if data and data:find("backend-timer", 1, true) then
                        d:set("cosocket", "ok")
                    else
                        d:set("cosocket", "recv:" .. tostring(rerr))
                    end
                end

                -- 3) 子请求：按注册时的 server 路由解析，走完整代理管线打后端
                local res = ngx.location.capture("/up/sub")
                if res and res.status == 200 and res.body:find("backend-sub", 1, true) then
                    d:set("subrequest", "ok")
                else
                    d:set("subrequest", "status:" .. tostring(res and res.status))
                end

                -- 4) light thread：定时器内同样可 spawn/wait
                local th = ngx.thread.spawn(function()
                    ngx.sleep(0.02)
                    return "thread-ok"
                end)
                local tok, tv = ngx.thread.wait(th)
                d:set("thread", (tok and tv) or "fail")

                d:set("done", "yes")
            end)
            if not ok then ngx.say("register:", err) return end
            ngx.say("registered")
        }
    }

    location /timer/state {
        content_by_lua_block {
            local d = ngx.shared.timer_state
            ngx.say("phase=", d:get("phase") or "")
            ngx.say("slept=", d:get("slept") or "")
            ngx.say("cosocket=", d:get("cosocket") or "")
            ngx.say("subrequest=", d:get("subrequest") or "")
            ngx.say("thread=", d:get("thread") or "")
            ngx.say("done=", d:get("done") or "")
        }
    }

    # every：回调 return false 后必须停止续期；计数由“后台定时器”累加。
    location /timer/every/start {
        content_by_lua_block {
            local d = ngx.shared.timer_state
            d:set("every_n", 0)
            local ok, err = ngx.timer.every(0.1, function(premature)
                ngx.sleep(0.01)
                local n = (tonumber(d:get("every_n")) or 0) + 1
                d:set("every_n", n)
                if n >= 3 then return false end
            end)
            if not ok then ngx.say("register:", err) return end
            ngx.say("registered")
        }
    }

    location /timer/every/state {
        content_by_lua_block {
            ngx.say("n=", ngx.shared.timer_state:get("every_n") or 0)
        }
    }

    location /up/ {
        proxy_pass http://127.0.0.1:18251/;
    }
}
