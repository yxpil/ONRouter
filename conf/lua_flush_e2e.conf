# ngx.flush / ngx.req.socket 实跑夹具（tools/lua_flush_socket_e2e.py 启动）
#   18520 明文 HTTP/1.1；18521 TLS + h2（ALPN 协商）
# 重点：/flush 在脚本 sleep 前就把头+首块发出去；/buffered 作为反证（不 flush 就等脚本跑完）。
error_log "logs/lua_flush_err.log" info;

limit_conn_zone $binary_remote_addr zone=streamip:1m;

server {
    listen 127.0.0.1:18520;

    # 流式正例：先 say+flush，再睡 1 秒
    location = /flush {
        content_by_lua_block {
            ngx.say("first")
            ngx.flush()
            ngx.sleep(1.0)
            ngx.say("second")
        }
        log_by_lua_block {
            ngx.log(ngx.ERR, "log-phase " .. ngx.req.get_path() .. " status=" .. ngx.status)
        }
    }

    # 反证：不调用 flush，整段缓冲到脚本结束
    location = /buffered {
        content_by_lua_block {
            ngx.say("a")
            ngx.sleep(0.8)
            ngx.say("b")
        }
    }

    # 不写 flush 但输出越过 64KB 自动阈值：应提前开始流式，且字节不丢
    location = /big {
        content_by_lua_block {
            for i = 1, 2048 do
                ngx.print(string.rep("x", 512))
            end
            ngx.sleep(0.8)
            ngx.say("done")
        }
    }

    # 头在首次 flush 时定稿：此后再改 ngx.header 不生效
    location = /status-flush {
        content_by_lua_block {
            ngx.status = 201
            ngx.say("x")
            ngx.flush()
            ngx.header["X-Late"] = "nope"
            ngx.say("y")
        }
    }

    # 有 header_filter_by_lua 时必须退回缓冲路径（过滤器需要完整响应）
    location = /filtered {
        header_filter_by_lua_block {
            ngx.header["X-Filtered"] = "1"
        }
        content_by_lua_block {
            ngx.say("f")
            ngx.flush()
            ngx.sleep(0.8)
            ngx.say("g")
        }
    }

    # ngx.req.socket：定长 + receiveuntil（含/不含分隔符）
    location = /socket {
        content_by_lua_block {
            local sock = ngx.req.socket()
            local a = sock:receive(5)
            local sep = sock:receiveuntil("\r\n\r\n")()
            local rest = sock:receive()
            local d, err = sock:receive(1)
            ngx.say("a=" .. a)
            ngx.say("sep=" .. #sep)
            ngx.say("rest=" .. rest)
            ngx.say("eof=" .. tostring(d) .. "/" .. tostring(err))
        }
    }

    location = /socket-until {
        content_by_lua_block {
            local sock = ngx.req.socket()
            local it = sock:receiveuntil("&", { inclusive = false })
            ngx.say("1=" .. tostring(it()))
            ngx.say("2=" .. tostring(it()))
            ngx.say("3=" .. tostring(it()))
            local d, err = it()
            ngx.say("eof=" .. tostring(d) .. "/" .. tostring(err))
        }
    }

    location = /hello {
        return 200 "hi\n";
    }
}

# limit_conn 额度必须覆盖整个流式响应期间（server 级；location 级 limit_conn 尚未支持）
server {
    listen 127.0.0.1:18522;
    limit_conn streamip 1;

    location = /slow {
        content_by_lua_block {
            ngx.say("start")
            ngx.flush()
            ngx.sleep(1.2)
            ngx.say("end")
        }
    }
}

server {
    listen 127.0.0.1:18521 ssl;
    http2 on;
    ssl_certificate     "../certs_https/a.pem";
    ssl_certificate_key "../certs_https/a.key";
    server_name a.local;

    location = /flush {
        content_by_lua_block {
            ngx.say("h2-first")
            ngx.flush()
            ngx.sleep(1.0)
            ngx.say("h2-second")
        }
    }
}
