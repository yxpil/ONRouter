# Lua at request time: a shared counter, header auth, and a redirect.
#
#   target/release/onrouter -c examples/lua-gateway.conf
#   curl http://127.0.0.1:18082/count            # increments across requests
#   curl -i http://127.0.0.1:18082/private/      # 401 without the token
#   curl -H "X-Token: demo" http://127.0.0.1:18082/private/   # 200
#   curl -i http://127.0.0.1:18082/go             # 302 -> /count
#
# The embedded Lua is 5.4. `ngx.*` follows the API shape config authors already know;
# shared dicts are sharded across worker threads, and each worker has its own Lua VM.

lua_shared_dict counters 1m;

server {
    listen 127.0.0.1:18082;
    server_name lua.example;

    location = /count {
        content_by_lua_block {
            local n, err = ngx.shared.counters:incr("hits", 1, 0)
            if not n then
                ngx.status = 500
                ngx.say("counter failed: ", err)
                return
            end
            ngx.say("hits: ", n)
        }
    }

    location = /go {
        content_by_lua_block {
            ngx.redirect("/count", 302)
        }
    }

    location /private/ {
        access_by_lua_block {
            if ngx.var.http_x_token ~= "demo" then
                ngx.exit(401)
            end
        }
        return 200 "private ok\n";
    }

    location / {
        return 200 "lua example\n";
    }
}
