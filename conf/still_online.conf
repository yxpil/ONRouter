# Still ONLine E2E：后端崩溃后用"最后已知良好响应"副本顶住页面，恢复后后台单飞重取。
# 端口：网关 18270，后端由 tools/still_online_e2e.py 起在 18271（脚本会杀掉再重启它）。
error_log "logs/still_online_err.log" info;
access_log "logs/still_online_access.log";

# 副本区按**字节**预算（副本装的是完整响应体，与 proxy_cache 的条数预算不同）
still_online_zone lkg 8m;
# tiny：配合 location 的 still_online_max_body 验证"超单条上限不收"
still_online_zone tiny 1m;

server {
    listen 127.0.0.1:18270;
    server_name lkg.local;

    location /ping {
        return 200 "pong";
    }
    location /metrics {
        content_by_rust metrics;
    }

    # 对照组：不开副本区 → 后端死了就是干净的 502
    location /off/ {
        proxy_pass http://127.0.0.1:18271;
    }

    # 主场景：GET 且 2xx 才写副本；回放带 X-Still-Online: stale 与 Age。
    # 退避压到秒级，便于脚本在几十秒内看到"恢复后自动重取"。
    location /lkg/ {
        proxy_pass http://127.0.0.1:18271;
        still_online lkg;
        still_online_retry 1s;
        still_online_retry_max 2s;
        still_online_retry_deadline 60s;
    }

    # 硬规则 1：上游响应带 Set-Cookie（登录表单、会话签发）永不入区
    location /cred/ {
        proxy_pass http://127.0.0.1:18271;
        still_online lkg;
        still_online_retry 1s;
    }

    # 硬规则 2/3：带 Cookie/Authorization 的请求永不写入副本；
    # allow_credentials on 只放开"这类请求可以读公共副本"。
    location /readallow/ {
        proxy_pass http://127.0.0.1:18271;
        still_online lkg;
        still_online_allow_credentials on;
        still_online_retry 1s;
        still_online_retry_max 2s;
        still_online_retry_deadline 60s;
    }

    # 单条上限：超过 still_online_max_body 的响应直接不收（不截断）
    location /big/ {
        proxy_pass http://127.0.0.1:18271;
        still_online tiny;
        still_online_max_body 64k;
        still_online_retry 1s;
    }
}
