# 重要客户学习（VIP 信誉 → 队列优先级 + 缓存驻留）E2E。
# 信誉跟着 $remote_addr 走，所以这里用 realip 把同一台机器上的几个"虚拟客户"分开：
#   203.0.113.10 —— 只做稀疏请求后立刻冲刷：学不到信誉，队列只给 depth_min；
#   203.0.113.40 —— 先按速率守规矩地走一段（攒够 min），它的突发能用运维给的天花板，
#                   它第一次写入的对象在草图里加权，因此扛得住后面的换位冲刷；
#   203.0.113.50 —— 对照：同样的对象，由没有信誉的客户写入。
# 网关 18290 / 后端 18291（与套件其它端口错开），见 tools/vip_learning_e2e.py。
error_log "logs/vip_learning_err.log" info;
access_log "logs/vip_learning_access.log";
pid "logs/vip_learning.pid";
reload 200ms;

limit_req_zone $remote_addr zone=vip:1m rate=10r/s burst=0;
limit_req_queue vip depth=8 depth_min=1 max_delay=2s;

learning on;
learning_memory_budget 64k;
limit_req_learning vip table=8k;
proxy_cache_learning rc sketch=8k;
vip_learning table=8k min=10 decay=30s;

# keys_zone=1k → 每区 8 条，正好让淘汰窗口（最老 8 条）覆盖全表
proxy_cache_path /tmp/onrouter_vip keys_zone=rc:1k;

server {
    listen 127.0.0.1:18290;
    server_name vip.local;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 127.0.0.0/8;
    real_ip_recursive on;

    # 就绪探针：不碰后端、不进限流
    location = /ping {
        return 200 "pong";
    }

    # realip 探针：不碰后端、不进限流、不进缓存，只在访问日志里留下改写后的 $remote_addr
    location = /probe {
        return 200 "probed";
    }

    location /vip/ {
        limit_req zone=vip;
        proxy_pass "http://127.0.0.1:18291/";
    }

    # 第 1 次访问就写入：用来铺"一次性对象"（草图里只有 1 分）
    location /r/ {
        proxy_pass "http://127.0.0.1:18291/";
        proxy_cache rc;
        proxy_cache_valid 200 60s;
    }

    # 第 3 次访问才写入：于是这个新对象进闸门时草图里已经是 3 分，够换掉 1 分的冷对象
    location /h/ {
        proxy_pass "http://127.0.0.1:18291/";
        proxy_cache rc;
        proxy_cache_valid 200 60s;
        proxy_cache_min_uses 3;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
