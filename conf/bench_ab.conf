# ============================================================
# A/B 压测专用配置：与 OpenResty 侧 bench.conf 逐条对齐
#   同一份静态文件 / 同一段 Lua 源码字符串 / 同一组 Python 后端
#   只监听明文 8080，不开 ssl，不开额外模块，避免把功能特性算进性能
# ============================================================

lua_shared_dict counters 1m;
access_log "logs/access.log";

upstream demo_backend {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
}

server {
    listen 8080;
    server_name localhost;
    root "../public";

    # 与 OpenResty bench.conf 里 content_by_lua 的字符串完全一致
    location = /bench/hello {
        content_by_lua "ngx.say('hello-from-lua-benchmark') ngx.say('method=', ngx.req.get_method(), ' path=', ngx.var.uri)";
    }

    # 共享字典原子自增
    location = /bench/count {
        content_by_lua "local d = ngx.shared.counters local n = d:incr('hits', 1, 0) ngx.header['Content-Type'] = 'text/plain; charset=utf-8' ngx.say('hits=' .. n)";
    }

    # 从磁盘 Lua 文件加载：测 *_file 指令的每请求开销（与 OpenResty 侧同一个绝对路径）
    location = /bench/luafile {
        content_by_lua_file "C:/Users/User/Desktop/LearnON/conf/bench_hello.lua";
    }

    location /bench/proxy/ {
        proxy_pass http://demo_backend/;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        return 200 "ok";
    }

    # 静态兜底：ONRouter 需要显式 location 才会走静态文件处理
    location / {
        root "../public";
    }
}
