# cache_advanced E2E：proxy_cache 并发合并 / use_stale / bypass / no_cache / keys_zone 容量
# 端口 18130，后端由 tools/cache_advanced_e2e.py 起在 18131（18132 用于“上游彻底失败”场景）。
error_log "logs/cache_adv_err.log" info;
access_log "logs/cache_adv_access.log";

# keys_zone 容量：1m → 8192 条；1k → 8 条（用于 LRU 淘汰验证，内存缓存不落盘）
proxy_cache_path /tmp/onrouter_cache keys_zone=pages:1m;
proxy_cache_path /tmp/onrouter_tiny keys_zone=tiny:1k;

server {
    listen 127.0.0.1:18130;
    server_name cache.local;

    location /ping {
        return 200 "pong";
    }

    # 基础命中语义（对照组）
    location /plain/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache pages;
        proxy_cache_valid 200 60s;
    }

    # proxy_cache_lock：同 key 并发回源合并（后端每个请求 sleep 0.5s）
    location /lock/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache pages;
        proxy_cache_valid 200 30s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
    }

    # use_stale http_502 / error：回源失败回放过期内容
    location /stale/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache pages;
        proxy_cache_valid 200 1s;
        proxy_cache_use_stale error timeout http_502;
    }

    # use_stale updating：刷新进行中，后来的请求立刻拿到 STALE
    location /updating/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache pages;
        proxy_cache_valid 200 1s;
        proxy_cache_lock on;
        proxy_cache_use_stale updating;
    }

    # bypass：命中表达式时跳过读取，但仍写入新响应。
    # key 去掉 query，才能让 ?nocache=1 与无查询串共享同一缓存条目。
    location /bypass/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache pages;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $arg_nocache;
    }

    # no_cache：命中表达式时不写入
    location /nocache_ctl/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache pages;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $arg_nocache;
        proxy_no_cache $arg_nocache;
    }

    # 小容量 zone：keys_zone=tiny:1k → 8 条，按 LRU 淘汰
    location /lru/ {
        proxy_pass http://127.0.0.1:18131;
        proxy_cache tiny;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
    }

    # 上游进程被关掉 → use_stale error 回放
    location /dead/ {
        proxy_pass http://127.0.0.1:18132;
        proxy_cache pages;
        proxy_cache_valid 200 1s;
        proxy_cache_use_stale error timeout;
    }
}
