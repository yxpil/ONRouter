# Static site with compression and cache headers.
#
#   target/release/onrouter -c examples/static-site.conf
#   curl -i http://127.0.0.1:18080/
#   curl -i http://127.0.0.1:18080/listing/      # directory listing (alias into public/)
#   curl -I http://127.0.0.1:18080/logo.png       # ETag / Last-Modified / expires
#
# `root` and `alias` are resolved relative to this file's directory.

gzip on;
gzip_min_length 100;
gzip_types text/html text/css application/json application/javascript;

server {
    listen 127.0.0.1:18080;
    server_name static.example;

    root "../public";
    index index.html;
    expires 1h;

    location = /health {
        return 200 "ok\n";
    }

    location / {
    }

    location /listing/ {
        alias "../public/";
        autoindex on;
    }

    location = /logo.png {
        expires 7d;
    }
}
