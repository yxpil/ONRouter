# Author: yxpil
# Cache governor E2E: sleep/boost phases driven by real traffic, deep-tier demotion
# into the disk cold layer, and pre-warm on boost. See tools/governor_e2e.py.
#
# The numbers are deliberately small so a test can cross them on a real clock:
#   low 2 rps / high 20 rps / hold 3s, deep tier, learning on (lead 0 = no prediction).
# Ports: gateway 18560, off-control instance 18561 (conf/governor_off.conf).
error_log "logs/governor_err.log" info;
access_log "logs/governor_access.log";
pid "logs/governor.pid";
reload 200ms;

cache_governor auto;
cache_governor_low 2;
cache_governor_high 20;
cache_governor_hold 3;
cache_governor_tier deep;
cache_governor_learn on;
cache_governor_lead 0;

# spill_after is set high on purpose: ordinary capacity eviction must not write
# anything, so every file under the cold root is proof of the governor's forced
# demotion path (which bypasses that gate by design).
lua_shared_dict govcache 4m disk=logs/gov_cache max_disk=32m levels=1:2 inactive=0 spill_after=1000 max_value=64k;

server {
    listen 127.0.0.1:18560;
    server_name governor.local;

    location = /ping {
        return 200 "pong";
    }

    location = /metrics {
        content_by_rust metrics;
    }

    # Cheap endpoint for load: the phase machine must follow request counts, not
    # the route's cost.
    location = /hit {
        return 200 "hit";
    }

    location = /seed {
        content_by_lua "
            local d = ngx.shared.govcache
            local n = tonumber(ngx.req.get_uri_args().n) or 64
            local v = string.rep('v', 512)
            for i = 0, n - 1 do
                d:set(string.format('k%03d', i), v)
            end
            ngx.say('seeded=', n)
        ";
    }

    # free_space counts the memory layer only, so a jump back to ~capacity after
    # sleep is direct proof the demotion reclaimed memory (num/size still count
    # the cold copies).
    location = /stats {
        content_by_lua "
            local d = ngx.shared.govcache
            ngx.say('num=', d:num())
            ngx.say('size=', d:size())
            ngx.say('free=', d:free_space())
            ngx.say('cap=', d:capacity())
        ";
    }

    location = /get {
        content_by_lua "
            local d = ngx.shared.govcache
            local k = ngx.req.get_uri_args().key or ''
            local v = d:get(k)
            if v then ngx.say('len=', #v) else ngx.say('nil') end
        ";
    }
}
