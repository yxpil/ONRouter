# TLS vhost serving HTTP/1.1, HTTP/2 and HTTP/3 on one port number.
#
# The certificate is the self-signed pair in certs/ (SAN: localhost, 127.0.0.1).
# Generate your own with:  cargo run --bin orr-gencert -- certs/cert.pem certs/key.pem your.domain
#
#   target/release/onrouter -c examples/tls-http2-http3.conf
#   curl -k -i --http2 https://127.0.0.1:18443/
#   curl -k -i --http1.1 https://127.0.0.1:18443/     # Alt-Svc advertises h3
#
# `ssl` terminates TCP; `http2` enables h2 on it; `quic` adds the UDP endpoint for h3.
# Without `http2` the TCP side stays HTTP/1.1 even though QUIC is listening (same as nginx).

server {
    listen 127.0.0.1:18443 ssl http2 quic;
    server_name secure.example localhost;

    ssl_certificate     "../certs/cert.pem";
    ssl_certificate_key "../certs/key.pem";
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /health {
        return 200 "ok\n";
    }

    location / {
        return 200 "hello over tls\n";
    }
}
