# WASM 网关插件 E2E —— 只服务 tools/wasm_e2e.py，不是示例配置。
#
# 要证明的是"插件真的在请求链路上"，而不是"模块能编译"：
#   access      缺 token 就地 403（业务后端一次都没被问）；带 token 放行，
#               且插件写回的请求头随转发到了后端；
#   过滤器      上游的响应被改写：状态、响应头（增/删）、响应体都变；
#   缓存        MISS 与 HIT 都过同一条过滤器，缓存只省回源、不省关口；
#   静态        WASM 过滤器对静态文件同样生效；
#   隔离        没声明插件的 location 完全不受影响；
#   fuel        死循环插件被指令预算拦住并 fail-closed 成 5xx，工作线程不挂；
#   -t          未声明插件 / 阶段函数缺失 / 非法选项都在配置阶段否决。
# 插件源码在 conf/wasm/ 下（.wat 文本格式，加载时编译）。
error_log "logs/wasm_e2e_err.log" info;
pid "logs/wasm_e2e.pid";

proxy_cache_path logs/wasm_cache keys_zone=wasmcache:1m;

wasm_plugin authz wasm/authz.wat;
wasm_plugin hf wasm/header_filter.wat;
wasm_plugin bf wasm/body_filter.wat;
# fuel 给小预算，死循环必须在毫秒级被拦下，而不是熬到超时
wasm_plugin spin wasm/fuel.wat fuel=200000 memory=1m;

upstream app {
    server 127.0.0.1:18396;
}

server {
    listen 127.0.0.1:18395;
    server_name wasm.local;

    location = /guarded {
        access_by_wasm authz;
        proxy_pass http://app;
    }

    location = /filtered {
        header_filter_by_wasm hf;
        body_filter_by_wasm bf;
        proxy_pass http://app;
    }

    location = /cached {
        proxy_cache wasmcache;
        proxy_cache_valid 200 60s;
        header_filter_by_wasm hf;
        body_filter_by_wasm bf;
        proxy_pass http://app;
        add_header X-Cache $upstream_cache_status;
    }

    location = /static.txt {
        root wasm_static;
        header_filter_by_wasm hf;
        body_filter_by_wasm bf;
    }

    location = /plain {
        proxy_pass http://app;
    }

    location = /fuel {
        access_by_wasm spin;
        proxy_pass http://app;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
