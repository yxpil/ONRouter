# Layer 4: a TCP tunnel routed by TLS SNI, and UDP sessions on the same process.
#
# TCP backends:   the TLS servers you already run (e.g. 127.0.0.1:9443)
# UDP backends:   any UDP echo/game server (e.g. `nc -u -l 127.0.0.1 18753`)
#
#   target/release/onrouter -c examples/stream-tcp-udp.conf
#   openssl s_client -connect 127.0.0.1:18751 -servername a.example.com   # routed by SNI
#   echo hello | nc -u 127.0.0.1 18752
#
# `ssl_preread` peeks the first TLS record for SNI and replays the bytes untouched: the
# backend still terminates TLS itself. UDP is session-based per client 4-tuple; each
# session owns a socket connected to its backend, so replies cannot cross clients.

# A small HTTP listener for health checks and /metrics alongside the L4 traffic.
server {
    listen 18750;
    server_name stream.example;
    location = /health { return 200 "ok\n"; }
    location = /metrics { content_by_rust metrics; }
}

stream {
    server {
        listen 18751;
        ssl_preread on;
        sni_match "a.example.com"   127.0.0.1:9443;
        sni_match "*.example.com"   127.0.0.1:9444;
        proxy_pass 127.0.0.1:9445;
    }

    upstream rooms {
        server 127.0.0.1:18753;
        server 127.0.0.1:18754;
    }

    server {                                 # request/response session
        listen 18752 udp;
        proxy_pass rooms;
        proxy_timeout 10s;
        udp_max_sessions 4096;
    }
}
