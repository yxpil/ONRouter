# set/if E2E：REWRITE 阶段的 set / if（nginx 常用子集）
# 端口 18370，无需后端（全部 return 静态响应）。tools/set_if_e2e.py 直接跑它。
error_log "logs/setif_err.log" info;
access_log "logs/setif_access.log";

server {
    listen 127.0.0.1:18370;
    server_name setif.local;

    location /ping {
        return 200 "pong";
    }

    # set：请求级变量、模板展开、多 token 值、覆盖同名内置变量（仅本请求）
    location /set {
        set $tag A;
        set $who anon-$arg_who;
        set $pair a b;
        set $uri /not-real-uri;
        if ($arg_flip) {
            set $tag B;
        }
        add_header X-Tag $tag;
        add_header X-Who $who;
        add_header X-Pair "$pair";
        add_header X-Uri $uri;
        return 200 "ok";
    }

    # 命中 break 后，同一 location 里后续书写的 set 不再执行
    location /stop {
        set $tag A;
        rewrite ^/stop$ /stop/deeper break;
        set $tag B;
        add_header X-Tag $tag;
        return 200 "ok";
    }

    location /guard {
        if ($arg_block) {
            return 403 "blocked";
        }
        return 200 "open";
    }

    # if (!$x)：变量为空/缺失才成立
    location /need-debug {
        if (!$arg_debug) {
            return 404 "need-debug";
        }
        return 200 "debug-on";
    }

    # = 与字面量比较
    location /method {
        if ($request_method = POST) {
            return 405 "no-post";
        }
        return 200 "get-ok";
    }

    # ~ / !~ ：对 $http_* 做部分匹配
    location /agent {
        set $route web;
        if ($http_x_kind ~ ^api) {
            set $route api;
        }
        if ($http_x_kind !~ ^api) {
            set $route other;
        }
        add_header X-Route $route;
        return 200 "ok";
    }

    # ~* ：忽略大小写
    location /ci {
        if ($http_x_flag ~* ^on$) {
            return 200 "ci-hit";
        }
        return 200 "ci-miss";
    }

    # if 里的 rewrite ... last 会重新匹配 location
    location /jump {
        if ($arg_go = yes) {
            rewrite ^ /landed last;
        }
        return 200 "stayed";
    }

    location /landed {
        return 200 "landed";
    }

    # 与 nginx 的已知差异：if 块里的 return 不许绕过 allow/deny（见 README）
    location /acl {
        allow 192.0.2.1;
        deny all;
        if ($arg_admin) {
            return 200 "if-bypass-attempt";
        }
        return 200 "normal";
    }
}
