# proxy 语义 E2E：proxy_send_timeout / proxy_next_upstream（http_XXX、non_idempotent、
# tries、timeout、invalid_header）。端口与其它套件错开（18160）。
error_log "logs/proxy_semantics_err.log" info;
access_log "logs/proxy_semantics_access.log";

# 每个 upstream 的第一台都是"坏节点"（18162），第二台是好节点（18161）。
# 独立 upstream 保证各自的 SWRR 状态从 0 开始，首请求必然先撞坏节点。
upstream nu_retry {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_default {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_post {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_post_strict {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_tries1 {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_tries2 {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_deadline {
    server 127.0.0.1:18162;
    server 127.0.0.1:18161;
}
upstream nu_invalid {
    server 127.0.0.1:18165;
    server 127.0.0.1:18161;
}

server {
    listen 127.0.0.1:18160;
    server_name semantics.local;
    client_max_body_size 128m;

    location /ping {
        content_by_lua "ngx.say('pong')";
    }

    # http_500 触发换节点：坏节点 500 → 好节点 200
    location /nu-retry {
        proxy_pass http://nu_retry;
        proxy_next_upstream error timeout http_500;
    }

    # 默认 error timeout：500 不换节点（对照组）
    location /nu-default {
        proxy_pass http://nu_default;
    }

    # POST 显式 non_idempotent 后才允许换节点
    location /nu-post {
        proxy_pass http://nu_post;
        proxy_next_upstream error timeout http_500 non_idempotent;
    }

    # POST 未配 non_idempotent：500 直接返回
    location /nu-post-strict {
        proxy_pass http://nu_post_strict;
        proxy_next_upstream error timeout http_500;
    }

    # tries=1：只允许一个节点，500 直接返回
    location /nu-tries1 {
        proxy_pass http://nu_tries1;
        proxy_next_upstream http_500;
        proxy_next_upstream_tries 1;
    }

    # tries=2：允许坏节点 500 后换到好节点
    location /nu-tries2 {
        proxy_pass http://nu_tries2;
        proxy_next_upstream http_500;
        proxy_next_upstream_tries 2;
    }

    # 坏节点每次先睡 30ms：超过 1ms 时间预算后不再换节点
    location /nu-deadline {
        proxy_pass http://nu_deadline;
        proxy_next_upstream http_500;
        proxy_next_upstream_timeout 1ms;
    }

    # 坏响应头 → invalid_header 换节点
    location /nu-invalid {
        proxy_pass http://nu_invalid;
        proxy_next_upstream invalid_header;
    }

    # 写超时：后端只读头部不收 body，64MB 请求体在 300ms 内写不动即断开
    location /big {
        proxy_pass http://127.0.0.1:18163;
        proxy_send_timeout 300ms;
        proxy_read_timeout 30s;
    }

    # 对照：send 不限制；请求体没发完，read 超时（2s）还不会开始计时
    location /big-nolimit {
        proxy_pass http://127.0.0.1:18163;
        proxy_send_timeout 0;
        proxy_read_timeout 2s;
    }

    # 正常大上传：后端持续读取，300ms 写超时不应误伤
    location /big-ok {
        proxy_pass http://127.0.0.1:18164;
        proxy_send_timeout 300ms;
        proxy_read_timeout 10s;
    }
}
