# ngx.shared.DICT 磁盘分层冷层 E2E —— 用真实流量证明"高频留内存、淘汰下来的低频数据落盘、
# 冷命中读回并提升"整条链路在跑，且 Lua 侧 API 一个字节都没改。端口与其它套件错开。
#
# 三个带冷层的区各用一个目录（同目录会被启动检查拒绝），一个不带冷层的对照区：
#   spill_after=0 → 任何淘汰受害者都落盘，用来验证机制本身
#   spill_after=2 → 只有攒够热度的条目才落盘，用来验证分层策略的选择性
error_log "logs/disk_cache_err.log" info;

lua_shared_dict tier   24k disk=cache/e2e-tier   max_disk=4m spill_after=0 max_value=2k;
lua_shared_dict bench  32k disk=cache/e2e-bench  max_disk=8m spill_after=0 max_value=2k;
lua_shared_dict policy 8k  disk=cache/e2e-policy max_disk=4m spill_after=2 max_value=2k;
lua_shared_dict plain  24k;

server {
    listen 127.0.0.1:18152;
    server_name disk-cache.local;

    location /metrics {
        content_by_rust metrics;
    }

    # ---- 机制：写满内存 → 淘汰的进磁盘 → 读回来 ----
    location /tier/warm {
        content_by_lua "
            local d = ngx.shared.tier
            d:flush_all()
            local v = string.rep('x', 900)   -- 单条 3+900+64=967，24k 只留得下 25 条
            for i = 0, 39 do
                assert(d:set(string.format('k%02d', i), v))
            end
            ngx.say('written=40')
            ngx.say('num=', d:num())
            ngx.say('cap=', d:capacity())
        ";
    }

    # 逐条读回并校验值：落盘是异步的，所以刚被挤出去的那一批允许等写线程一轮。
    # 等完之后还读不到（bad）只可能是真丢了数据，这是这一步唯一要证明的事。
    # ?wait=0 关掉等待，用来验证"清空后一条都不该在"。
    location /tier/readall {
        content_by_lua "
            local d = ngx.shared.tier
            local wait = tonumber(ngx.req.get_uri_args().wait) or 30
            local ok, bad, waited = 0, 0, 0
            for i = 0, 39 do
                local k = string.format('k%02d', i)
                local v = d:get(k)
                for _ = 1, wait do
                    if v then break end
                    ngx.sleep(0.005)
                    v = d:get(k)
                    waited = waited + 1
                end
                if v and #v == 900 then ok = ok + 1 else bad = bad + 1 end
            end
            ngx.say('ok=', ok)
            ngx.say('bad=', bad)
            ngx.say('waited=', waited)
        ";
    }

    # 队列排空之后的账目：num() 要覆盖两层，free_space() 只算内存层
    location /tier/state {
        content_by_lua "
            local d = ngx.shared.tier
            ngx.say('num=', d:num())
            ngx.say('free=', d:free_space())
            ngx.say('cap=', d:capacity())
        ";
    }

    location /tier/clear {
        content_by_lua "
            ngx.shared.tier:flush_all()
            ngx.say('cleared=', tostring(ngx.shared.tier:num()))
        ";
    }

    # ---- 重启不丢：只写不读，让淘汰把数据留在盘上，进程重启后再读 ----
    location /persist/seed {
        content_by_lua "
            local d = ngx.shared.tier
            d:flush_all()
            local v = string.rep('p', 900)
            for i = 0, 39 do
                assert(d:set(string.format('p%02d', i), v))
            end
            ngx.say('seeded=40')
            ngx.say('num=', d:num())
        ";
    }

    location /persist/read {
        content_by_lua "
            local d = ngx.shared.tier
            local ok, bad = 0, 0
            for i = 0, 39 do
                local v = d:get(string.format('p%02d', i))
                if v and #v == 900 then ok = ok + 1 else bad = bad + 1 end
            end
            ngx.say('ok=', ok)
            ngx.say('bad=', bad)
        ";
    }

    # ---- 策略选择性：一次性数据不该占磁盘 ----
    # 这一步只在内存里攒热度，不产生任何淘汰
    location /policy/hot {
        content_by_lua "
            local d = ngx.shared.policy
            d:flush_all()
            d:set('hot', 'H')
            for _ = 1, 5 do d:get('hot') end          -- freq=6，越过 spill_after=2
            ngx.say('hot=', tostring(d:get('hot')))
            ngx.say('num=', d:num())
        ";
    }

    # 隔一会儿再灌填充数据：hot 的 recency 掉下来就成了唯一的淘汰受害者，
    # 而它 freq=6 越过阈值 → 落盘；b* 全是 freq=1 → 一次都不许写盘
    location /policy/churn {
        content_by_lua "
            local d = ngx.shared.policy
            for i = 1, 200 do
                d:set(string.format('b%03d', i), string.rep('z', 100))
            end
            ngx.say('churned=200')
            ngx.say('num=', d:num())
        ";
    }

    # 落盘排空后再读 hot：这一次必须冷命中并提升回内存
    location /policy/recheck {
        content_by_lua "
            local d = ngx.shared.policy
            local v = d:get('hot')
            ngx.say('hot=', tostring(v))
            ngx.say('num=', d:num())
        ";
    }

    # ---- 延迟：冷读 / 内存读 / 真未命中（零磁盘 IO）三条路径 ----
    location /bench/seed {
        content_by_lua "
            local d = ngx.shared.bench
            d:flush_all()
            local v = string.rep('x', 300)   -- 单条 ~367B，32k 只留得下 89 条
            for i = 1, 300 do
                assert(d:set(string.format('s%04d', i), v))
            end
            d:set('mem', v)
            ngx.say('seeded=300')
            ngx.say('num=', d:num())
        ";
    }

    location /bench/cold {
        content_by_lua "
            local args = ngx.req.get_uri_args()
            local i = tonumber(args.i) or 1
            local v = ngx.shared.bench:get(string.format('s%04d', i))
            ngx.say('len=', v and #v or 0)
        ";
    }

    location /bench/hotpath {
        content_by_lua "
            local v = ngx.shared.bench:get('mem')
            ngx.say('len=', v and #v or 0)
        ";
    }

    location /bench/miss {
        content_by_lua "
            local args = ngx.req.get_uri_args()
            local i = tonumber(args.i) or 1
            local v = ngx.shared.bench:get(string.format('zz%04d', i))
            ngx.say('nil=', tostring(v == nil))
        ";
    }

    location /bench/plainmiss {
        content_by_lua "
            local args = ngx.req.get_uri_args()
            local i = tonumber(args.i) or 1
            local v = ngx.shared.plain:get(string.format('zz%04d', i))
            ngx.say('nil=', tostring(v == nil))
        ";
    }

    # ---- API 未变：同一段不改写的 OpenResty 脚本，两个区跑出逐字节一致的结果 ----
    location /parity {
        content_by_lua "
            local function run(d)
                local r = {}
                d:flush_all()
                r[#r+1] = 'set=' .. tostring(d:set('k', 'v1', 60))
                r[#r+1] = 'get=' .. tostring(d:get('k'))
                r[#r+1] = 'add=' .. tostring(d:add('k', 'x'))
                r[#r+1] = 'replace=' .. tostring(d:replace('k', 'v2'))
                r[#r+1] = 'incr=' .. tostring(d:incr('n', 3, 0))
                r[#r+1] = 'decr=' .. tostring(d:decr('n', 1))
                r[#r+1] = 'bump=' .. tostring(d:bump('n', 2))
                r[#r+1] = 'ttl>0=' .. tostring(d:ttl('k') > 0)
                r[#r+1] = 'keys=' .. (function()
                    local t = { d:get_keys(100) }
                    local ks = t[1]
                    table.sort(ks)
                    return table.concat(ks, ',')
                end)()
                r[#r+1] = 'num=' .. tostring(d:num())
                r[#r+1] = 'size=' .. tostring(d:size())
                r[#r+1] = 'cap=' .. tostring(d:capacity())
                r[#r+1] = 'free<=cap=' .. tostring(d:free_space() <= d:capacity())
                local v, stale = d:get_stale('k')
                r[#r+1] = 'stale=' .. tostring(v) .. '/' .. tostring(stale)
                r[#r+1] = 'del=' .. tostring(d:delete('k'))
                r[#r+1] = 'gone=' .. tostring(d:get('k'))
                return table.concat(r, '|')
            end
            local a = run(ngx.shared.plain)
            local b = run(ngx.shared.tier)
            ngx.say('plain=', a)
            ngx.say('tier=', b)
            ngx.say('same=', tostring(a == b))
        ";
    }

    # ---- 路径来自 key 哈希：遍历型 key 也只能落在十六进制目录里 ----
    # 反斜杠/回车用 string.char 拼，免得配置文件的多层转义把测试数据本身改掉
    location /evilkeys/write {
        content_by_lua "
            local d = ngx.shared.tier
            d:flush_all()
            local bs = string.char(92)
            local keys = {
                '../../../../Windows/System32/evil',
                ('..' .. bs .. '..' .. bs .. '..' .. bs .. '..' .. bs .. 'tmp' .. bs .. 'evil'),
                '/absolute/evil',
                string.rep('../', 50) .. 'evil',
                string.char(13) .. string.char(10) .. '../evil',
            }
            for _, k in ipairs(keys) do assert(d:set(k, 'payload')) end
            for i = 0, 39 do
                assert(d:set(string.format('f%02d', i), string.rep('x', 900)))
            end
            ngx.say('written=5')
        ";
    }

    location /evilkeys/read {
        content_by_lua "
            local d = ngx.shared.tier
            local bs = string.char(92)
            local keys = {
                '../../../../Windows/System32/evil',
                ('..' .. bs .. '..' .. bs .. '..' .. bs .. '..' .. bs .. 'tmp' .. bs .. 'evil'),
                '/absolute/evil',
                string.rep('../', 50) .. 'evil',
                string.char(13) .. string.char(10) .. '../evil',
            }
            local ok = 0
            for _, k in ipairs(keys) do
                if d:get(k) == 'payload' then ok = ok + 1 end
            end
            ngx.say('roundtrip=', ok)
        ";
    }

    # ---- flush_all 与排队落盘的竞态：淘汰刚入队、还没落盘，就来了 flush_all ----
    # 这批排队任务属于"被 flush 掉的那一代"，落地下盘时必须整批丢弃；
    # 早先没有代际标记时，它们会在 flush_all 之后登记回索引，等于数据复活。
    location /race/flush {
        content_by_lua "
            local d = ngx.shared.tier
            d:flush_all()
            local v = string.rep('r', 900)
            for i = 0, 39 do
                assert(d:set(string.format('r%02d', i), v))
            end
            d:flush_all()
            ngx.say('flushed=', tostring(d:num()))
        ";
    }

    location /load {
        content_by_lua "
            local d = ngx.shared.tier
            local i = tonumber((ngx.req.get_headers()['X-Seq'])) or 0
            local k = string.format('L%05d', i % 400)
            local v = d:get(k)
            if not v then
                d:set(k, string.rep('y', 500))
                v = d:get(k)
            end
            ngx.say('len=', v and #v or 0)
        ";
    }
}
