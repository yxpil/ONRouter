# ============================================================
# least_time 自适应上游选择的性能基准专用配置
#   一个 vhost、四个 location，四个上游池形状完全相同（同样三个 Python 后端、同样的
#   max_fails/fail_timeout/keepalive），只差 upstream 里那一条 least_time ——
#   于是两行之间的 rps 差就是这条支路的每请求成本：
#     /lt/floor  upstream 里只有 1 个节点：没有"选谁"这回事，用来分离
#                "反代这套形状本身的成本"与"选择算法的成本"
#     /lt/off    3 节点纯 SWRR 轮询（默认档，也是 observe/on 的对照）
#     /lt/obs    observe：轮询选点 + 每请求写 EWMA/在途原子量、多一次 P2C 打分
#     /lt/on     on：真的按 P2C + 时延 EWMA 选点
#   与 bench_ab.conf 对齐：同一份静态文件目录、同一个 access_log、同一组 Python 后端。
#   端口 8700（网关）与 9001/9002/9003（后端）与其它套件错开：
#   回归用 18xxx，front_proxy 基准用 8690-8695。
# ============================================================
error_log "logs/bench_least_time_err.log" warn;
pid "logs/bench_least_time.pid";
access_log "logs/bench_least_time_access.log";

# 只有一个节点的池：选点必然命中它，用来量"没有选择"的形状
upstream ltFloor {
    server 127.0.0.1:9001;
}

upstream ltOff {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
    server 127.0.0.1:9003;
}

# observe 与 on 用同一个窗口，保证两行只差"要不要按分数改判"
upstream ltObs {
    least_time observe;
    least_time_window 2s;
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
    server 127.0.0.1:9003;
}

upstream ltOn {
    least_time on;
    least_time_window 2s;
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
    server 127.0.0.1:9003;
}

server {
    listen 127.0.0.1:8700;
    server_name lt-bench.local;

    location = /ping {
        content_by_lua "ngx.say('pong')";
    }

    location = /lt/floor {
        proxy_pass http://ltFloor/ping;
    }

    location = /lt/off {
        proxy_pass http://ltOff/ping;
    }

    location = /lt/obs {
        proxy_pass http://ltObs/ping;
    }

    location = /lt/on {
        proxy_pass http://ltOn/ping;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
