# proxy_cache 磁盘冷层 E2E —— 用真实流量证明"被内存挤出去的新鲜响应落盘、下次读回来仍是命中
# （不打后端）、重启后扫目录重建、坏文件不会发出错内容、没开 disk=on 的区一个字节都不写"。
#
# 三个区都只有 8 条内存容量（keys_zone=1k → 1024/128），所以十几条 URL 就会把最早的几条挤出去：
#   tier   disk=on spill_after=0  → 任何淘汰受害者都落盘，用来验证机制本身与跨重启
#   gate   disk=on spill_after=3  → 只被请求过一次的对象不落盘，用来验证频率门槛（一次性流量不写盘）
#   plain  没有 disk=              → 对照组：同样被挤掉，但只能回源，且目录根本不会被创建
# 冷层目录写在配置里是相对路径，按"配置文件所在目录"解析 → 实际落在 conf/logs/ 下（已 gitignore）。
error_log "logs/proxy_disk_err.log" info;
access_log "logs/proxy_disk_access.log";

proxy_cache_path logs/proxy_disk_tier  keys_zone=tier:1k  disk=on max_size=8m spill_after=0 max_value=256k;
proxy_cache_path logs/proxy_disk_gate  keys_zone=gate:1k  disk=on max_size=8m spill_after=3 max_value=256k;
proxy_cache_path logs/proxy_disk_plain keys_zone=plain:1k;

server {
    listen 127.0.0.1:18480;
    server_name proxy-disk.local;

    # 就绪探针：不碰后端、不进缓存
    location /ping {
        return 200 "pong";
    }

    location = /metrics {
        content_by_rust metrics;
    }

    # 后端自己维护"这个 id 真的被服务过几次"，脚本用它判定有没有回源
    location /tier/ {
        proxy_pass http://127.0.0.1:18481;
        proxy_cache tier;
        proxy_cache_valid 200 10m;
    }

    location /gate/ {
        proxy_pass http://127.0.0.1:18481;
        proxy_cache gate;
        proxy_cache_valid 200 10m;
    }

    location /plain/ {
        proxy_pass http://127.0.0.1:18481;
        proxy_cache plain;
        proxy_cache_valid 200 10m;
    }
}
