# 队列学习 E2E：三个同样速率（10r/s burst=0）的限流区，只改"超限之后怎么办"。
#   plain —— 没写 limit_req_queue：超限即拒（等价 nginx nodelay），是默认关闭的对照；
#   stat  —— 写了队列但没学：固定 depth=8，排队时长由配置天花板决定；
#   learn —— 队列 + 按 key 学突发形状：冷 key 只给 depth_min，刚结束一股突发的 key 自动多排，
#            持续洪水则把记忆清零（回到 depth_min）。
# 网关 18280 / 后端 18281（与套件其它端口错开），见 tools/queue_learning_e2e.py。
error_log "logs/queue_learning_err.log" info;
access_log "logs/queue_learning_access.log";
pid "logs/queue_learning.pid";
reload 200ms;

limit_req_zone $remote_addr zone=plain:1m rate=10r/s burst=0;
limit_req_zone $remote_addr zone=stat:1m rate=10r/s burst=0;
limit_req_zone $remote_addr zone=learn:1m rate=10r/s burst=0;

limit_req_queue stat depth=8 depth_min=8 max_delay=2s;
limit_req_queue learn depth=8 depth_min=1 max_delay=2s;

learning on;
learning_memory_budget 64k;
limit_req_learning learn table=16k;

server {
    listen 127.0.0.1:18280;
    server_name queue.local;

    # 就绪探针：不碰后端、不进限流
    location = /ping {
        return 200 "pong";
    }

    location /plain/ {
        limit_req zone=plain;
        proxy_pass "http://127.0.0.1:18281/";
    }

    location /stat/ {
        limit_req zone=stat;
        proxy_pass "http://127.0.0.1:18281/";
    }

    location /learn/ {
        limit_req zone=learn;
        proxy_pass "http://127.0.0.1:18281/";
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
