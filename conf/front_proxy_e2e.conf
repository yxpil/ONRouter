# front_proxy（前置代理/CDN 感知）E2E + 示例 —— 真实流量证明"认出哪家代理、按声明的头链还原
# 真实客户端、以及伪造头一律不采信"。端口与其它套件错开（18380 起）。
#
# ── 这套设计的一条硬约束 ─────────────────────────────────────────────
# 引擎里没有任何厂商名字。每家代理 = 一条 `front_proxy <名字> { … }` 配置，块里只写两类事实：
#   probe        —— 靠哪些头认出它是它（多条 AND；`~ <子串>` 用来比对取值）
#   ip_header    —— 真实客户端地址的候选头，按书写顺序优先（一条链，前一个没有可用值就用下一个）
#   country_header / proto_header / host_header —— 各角色的头，各只取第一条
#   trust        —— 它家的边缘网段（可以写多条，也可以一条写多个 CIDR）
# 厂商改名、加头、换网段都是改这张表；不为任何一家单独写代码路径。
#
# ── 采信闸门（没有开关可以关）─────────────────────────────────────────
# 任何从头部取来的值（地址、协议、Host、国家）都要求**直连 TCP 对端**落在
# `profile.trust ∪ set_real_ip_from` 里。原因很直接：这些头是任何人都能发的。
# 各家的公开文档里都能找到"哪个头客户端也能自己塞"（比如 Fastly 只在头缺失时补值），
# 所以识别和信任是两件事：识别只用于标注与指标，信任只来自网段。
#
# 三档模式（server 级）：
#   front_proxy_mode off;     默认，连看都不看这些头
#   front_proxy_mode detect;  只认出来、标注 $front_proxy，一个值都不改写
#   front_proxy_mode egress;  认出之后按 profile 走出口优化（地址/协议/来源元数据/Cache-Status）
# 地址改写的授权根默认只有 `set_real_ip_from`；`front_proxy_auto_trust on;` 才让 profile 自己的
# trust 网段也成为授权根（-t 与启动时都会就这条告警，因为它把"网段写对"变成了安全前提）。
#
# ── 本机怎么造出"可信 / 不可信"两种对端 ───────────────────────────────
# 所有连接都来自 127.0.0.1，于是用不同端口 = 不同 server = 不同 profile 的 trust 段来区分：
#   18380 egress + auto_trust on，profile 的 trust 含环回 → 地址/协议/国家全落地，
#         limit_req 与 geo 看到的都是真实客户端（这是"计数落对地址"的铁证）
#   18381 同上但 profile 的 trust 是 10.99.0.0/16（不含环回）→ 全套伪造头一个字段都改不动
#   18382 egress 且 auto_trust 保持默认 off → 认得出、协议与国家照采，地址一律不动
#   18383 detect → 只标注，不改写任何东西
#   18384 egress + proxy_cache：作为源站对前置代理输出 RFC 9209 Cache-Status
#   18385 由 tools/front_proxy_e2e.py 起的假源站（回源后端）
# 见 tools/front_proxy_e2e.py。
error_log "logs/front_proxy_err.log" info;
access_log "logs/front_proxy_access.log";
pid "logs/front_proxy.pid";

# 限流按 $remote_addr —— front_proxy 的改写发生在 limit_req 之前，所以这一条就是"计数落对地址"的探针
# 每个 vhost 用独立 zone：对照组之间不能共用键，否则一边打满会把另一边挤成 429，测不出因果
limit_req_zone $remote_addr zone=fprl:1m  rate=5r/s burst=0;
limit_req_zone $remote_addr zone=fprl1:1m rate=5r/s burst=0;
limit_req_zone $remote_addr zone=fprl2:1m rate=5r/s burst=0;

# geo 源=$remote_addr：与 realip 同理，它看到的是改写后的地址
geo $remote_addr $net {
    default          external;
    203.0.113.0/24   testnet;
    127.0.0.0/8      localnet;
}

proxy_cache_path /tmp/onrouter_fp keys_zone=fpzone:1m;

# ---- 主 profile：对端可验证（trust 含环回）----
front_proxy demo-edge {
    # 两个探针 AND：头都要出现，且 X-Demo-Edge-Id 的取值里必须含 "edge"
    probe X-Demo-Edge-Id ~ edge;
    probe X-Demo-Edge-Ray;
    # 地址候选链：首选专有能力头，退到通用 XFF
    ip_header X-Demo-Real-Client;
    ip_header X-Forwarded-For;
    country_header X-Demo-Edge-Country;
    proto_header   X-Demo-Edge-Visitor;
    host_header    X-Forwarded-Host;
    trust 127.0.0.0/8;
}

# ---- 同一家，但网段写成了"对不上"的段：验证闸门必须挡住一切头部取值 ----
front_proxy demo-edge-wrong-range {
    probe X-Odd-Edge-Id;
    ip_header X-Demo-Real-Client;
    ip_header X-Forwarded-For;
    country_header X-Demo-Edge-Country;
    proto_header   X-Demo-Edge-Visitor;
    trust 10.99.0.0/16;
}

# ---- 只有通用 XFF、没有任何专有名头：照样能声明，只是识别证据弱 ----
front_proxy plain-xff {
    probe X-Forwarded-For;
    ip_header X-Forwarded-For;
    trust 127.0.0.0/8;
}

# ---- egress + auto_trust on：地址改写走 profile 自己的 trust ----
server {
    listen 127.0.0.1:18380;
    server_name fp-egress.local;
    front_proxy_mode egress;
    front_proxy_auto_trust on;

    # 就绪探针：不碰后端、不参与识别判定
    location = /ping {
        return 200 "pong";
    }

    # 限流探针：三个不同真实客户端各发一次都该过（键分开），
    # 同一个真实客户端连发则该被自己的键限住 —— 只有改写生效才会出现这种分裂
    location = /lim {
        limit_req zone=fprl;
        return 200 "ok\n";
    }

    location = /who {
        content_by_lua "
            ngx.header['X-Fp']            = tostring(ngx.var.front_proxy)
            ngx.header['X-Fp-Verified']   = tostring(ngx.var.front_proxy_verified)
            ngx.header['X-Fp-Country']    = tostring(ngx.var.front_proxy_country)
            ngx.header['X-Fp-Host']        = tostring(ngx.var.front_proxy_host)
            ngx.header['X-Realip-Remote'] = tostring(ngx.var.realip_remote_addr)
            ngx.header['X-Net']            = tostring(ngx.var.net)
            ngx.header['X-Scheme']         = tostring(ngx.var.scheme)
            ngx.header['X-Xff']            = tostring(ngx.var.http_x_forwarded_for)
            ngx.say(ngx.var.remote_addr)
        ";
    }
    location / {
        return 200 "egress\n";
    }
}

# ---- 网段对不上：所有头部取值必须一个都不生效（防伪造）----
server {
    listen 127.0.0.1:18381;
    server_name fp-unverified.local;
    front_proxy_mode egress;
    front_proxy_auto_trust on;

    location = /who {
        content_by_lua "
            ngx.header['X-Fp']          = tostring(ngx.var.front_proxy)
            ngx.header['X-Fp-Verified'] = tostring(ngx.var.front_proxy_verified)
            ngx.header['X-Fp-Country']  = tostring(ngx.var.front_proxy_country)
            ngx.header['X-Scheme']      = tostring(ngx.var.scheme)
            ngx.header['X-Net']         = tostring(ngx.var.net)
            ngx.say(ngx.var.remote_addr)
        ";
    }
    # 对照：不改写地址时，几个"声称不同客户端"的请求全落在同一个键（节点地址）上
    location = /lim {
        limit_req zone=fprl1;
        return 200 "ok\n";
    }
    location / {
        return 200 "unverified\n";
    }
}

# ---- auto_trust 默认 off：识别 + 来源元数据照采，地址一律不动 ----
server {
    listen 127.0.0.1:18382;
    server_name fp-recog-only.local;
    front_proxy_mode egress;

    location = /who {
        content_by_lua "
            ngx.header['X-Fp']         = tostring(ngx.var.front_proxy)
            ngx.header['X-Fp-Country'] = tostring(ngx.var.front_proxy_country)
            ngx.header['X-Scheme']     = tostring(ngx.var.scheme)
            ngx.header['X-Net']        = tostring(ngx.var.net)
            ngx.say(ngx.var.remote_addr)
        ";
    }
    # 对照：auto_trust 未开 → 地址不动，限流键仍是节点地址
    location = /lim {
        limit_req zone=fprl2;
        return 200 "ok\n";
    }
    location / {
        return 200 "recog\n";
    }
}

# ---- detect：只标注，不改写任何东西 ----
server {
    listen 127.0.0.1:18383;
    server_name fp-detect.local;
    front_proxy_mode detect;
    # 这里刻意不写 front_proxy_auto_trust：detect 档根本不改写地址，写了会被 -t 直接否决
    # （"配置读起来像生效、运行时一行不跑"是这套代码库认定必须硬失败的那类失效）。

    location = /who {
        content_by_lua "
            ngx.header['X-Fp']         = tostring(ngx.var.front_proxy)
            ngx.header['X-Fp-Country'] = tostring(ngx.var.front_proxy_country)
            ngx.header['X-Scheme']     = tostring(ngx.var.scheme)
            ngx.say(ngx.var.remote_addr)
        ";
    }
    location / {
        return 200 "detect\n";
    }
}

# ---- 源站侧可缓存性：egress 且对端验证过时，对前置代理输出 Cache-Status ----
server {
    listen 127.0.0.1:18384;
    server_name fp-origin.local;
    front_proxy_mode egress;
    front_proxy_auto_trust on;

    # 就绪探针：不参与缓存、不回源
    location = /ping {
        return 200 "pong";
    }

    location /c/ {
        proxy_cache fpzone;
        proxy_cache_valid 200 60s;
        proxy_cache_key "$scheme$host$request_uri";
        # 出口模式改写的 $scheme/$remote_addr 要能传到后端，才算"协议与真实地址都对上"
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:18385;
    }
    location = /metrics {
        content_by_rust metrics;
    }
}

# ── 真要接一家现成的代理，怎么写这张表（示例，全部注释掉）──────────────────
# 上面三个 profile 用的是编造的名字和头，这个套件不能替任何厂商背书。下面是"照着抄"的形状：
# 头名照抄它家文档，网段**必须在部署时去它家公布的地址现取**（边缘网段会轮换，抄进仓库就是等它过期）。
# 写完之后用 `-t` 看它是否被认出来，再看 /metrics 的 onrouter_front_proxy_total：
# matched 涨、ip_applied 不涨 = 对端没落进你写的网段（写窄了或写错了），不是"功能没生效"。
#
# front_proxy cf-edge {
#     probe CF-Ray;                     # 每个请求都有，值形状稳定
#     probe CF-Visitor ~ scheme;        # JSON 形状，engine 只认 "scheme" 键
#     ip_header True-Client-IP;         # 有付费版开关就用这条（唯一不为客户端所控制的地址头）
#     ip_header CF-Connecting-IP;       # 退到这条：同样只可能来自它家网段
#     ip_header X-Forwarded-For;        # 再退到通用链
#     country_header CF-IPCountry;      # 两字母
#     proto_header   CF-Visitor;        # {"scheme":"https",…}
#     host_header    X-Forwarded-Host;
#     trust <部署时从它家 ips-v4 / ips-v6 现取的段>;   # 可以多条，也可以一条写多个
# }
#
# 这条 profile 一旦写对，egress 档上：$remote_addr / limit_req / geo / allow-deny / VIP 信誉 /
# access_log 首列全部换成访客真实地址，$scheme 恢复成访客那侧的 https，源站还能对它输出
# Cache-Status 让 CDN 量化自己吸收了多少流量。写不对（对端不在段内）时，这些一律留在节点地址上——
# 这是设计，不是缺陷：谁都能发这些头。
