# HTTPS 实际业务矩阵：多端口 × 多域名 × 多证书 × 多协议版本 × ALPN。
# 证书由 tools/https_matrix_e2e.py 生成到 certs_https/（已 gitignore），每张证书一个域名：
#   default.local / a.local(+www.a.local) / b.local / *.wild.local / api.wild.local
#
#   18443 多 vhost SNI，TLS1.2+1.3，无 h2     ← 主矩阵：选证书、Host/SNI 交叉、证书校验
#   18444 单 vhost，仅 TLS1.2                  ← 版本裁剪：1.3-only 客户端应被拒
#   18445 单 vhost，仅 TLS1.3                  ← 版本裁剪：1.2-only 客户端应被拒
#   18446 明文 HTTP                            ← 端口隔离：同一域名不同端口互不串
#   18447 单 vhost，TLS + http2 on             ← ALPN：h2 与 http/1.1 共存
error_log "logs/https_matrix_err.log" info;

# ---------- 18443：默认 vhost 放在最前（SNI 无匹配时的默认证书 = 第一张） ----------
server {
    listen 127.0.0.1:18443 ssl default_server;
    server_name default.local;
    ssl_certificate     "../certs_https/default.pem";
    ssl_certificate_key "../certs_https/default.key";
    location / { return 200 "vhost-default\n"; }
}

server {
    listen 127.0.0.1:18443 ssl;
    server_name a.local www.a.local;
    ssl_certificate     "../certs_https/a.pem";
    ssl_certificate_key "../certs_https/a.key";
    location / { return 200 "vhost-a\n"; }
}

server {
    listen 127.0.0.1:18443 ssl;
    server_name b.local;
    ssl_certificate     "../certs_https/b.pem";
    ssl_certificate_key "../certs_https/b.key";
    location / { return 200 "vhost-b\n"; }
}

server {
    listen 127.0.0.1:18443 ssl;
    server_name *.wild.local;
    ssl_certificate     "../certs_https/wild.pem";
    ssl_certificate_key "../certs_https/wild.key";
    location / { return 200 "vhost-wild\n"; }
}

# 精确名必须压过通配：api.wild.local 同时命中 *.wild.local，应选这张
server {
    listen 127.0.0.1:18443 ssl;
    server_name api.wild.local;
    ssl_certificate     "../certs_https/api.pem";
    ssl_certificate_key "../certs_https/api.key";
    location / { return 200 "vhost-api\n"; }
}

# ---------- 18444 / 18445：同证书、不同协议版本裁剪 ----------
server {
    listen 127.0.0.1:18444 ssl;
    server_name a.local;
    ssl_certificate     "../certs_https/a.pem";
    ssl_certificate_key "../certs_https/a.key";
    ssl_protocols TLSv1.2;
    location / { return 200 "port-tls12\n"; }
}

server {
    listen 127.0.0.1:18445 ssl;
    server_name a.local;
    ssl_certificate     "../certs_https/a.pem";
    ssl_certificate_key "../certs_https/a.key";
    ssl_protocols TLSv1.3;
    location / { return 200 "port-tls13\n"; }
}

# ---------- 18446：明文，同域名不同端口必须各自独立 ----------
server {
    listen 127.0.0.1:18446;
    server_name a.local;
    location / { return 200 "port-plain\n"; }
}

# ---------- 18447：ALPN h2 + http/1.1 ----------
server {
    listen 127.0.0.1:18447 ssl;
    server_name a.local;
    http2 on;
    ssl_certificate     "../certs_https/a.pem";
    ssl_certificate_key "../certs_https/a.key";
    location / { return 200 "port-h2\n"; }
}
