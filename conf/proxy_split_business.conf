# 业务分流真实场景 E2E 专用配置（tools/proxy_split_business_e2e.py 使用）。
#
# 这份配置的形状刻意贴一个真实站点：**UGC 主页托管站**，登录用户按业务身份分版本，
# 首页走缓存，写请求是 POST 评论，发布时沿阶梯（hotfix → next → stable）逐级放量，
# 并且要能演完两件事：某一路整体挂掉时的"串不串台"，以及键选错时的业务后果。
#
#   登录态 uid  分流键是 `${cookie_uid}`，即业务身份本身。同一用户的整个会话
#               （首页 + API + 写评论）必须始终落在同一个版本上，否则会看到
#               "上一屏是新版本、下一屏是旧版本"的撕裂。
#   池即版本    app_stable / app_next / app_hotfix 是三个独立 upstream：各自的健康形态、
#               各自的摘除计数、各自的缓存条目。
#   两个死池    app_grey(18377) 与 app_bleed(18378) 故意不起后端，用来演"这一路给不出
#               后端"。它们必须是**两个**池：节点健康是按池算的，两条声明共用一个死池
#               会把彼此的健康计数踩掉，`off` 与 `on` 两种处置就分不开。
#   键的对照    $addr_release 用 `${remote_addr}`，与 $app_release 只差键，用来把
#               "CDN 前置时整站塌到一路"从一句警告变成一个能跑出来的断言。

error_log "logs/proxy_split_business_err.log" warn;
access_log "logs/proxy_split_business_access.log";
pid "logs/proxy_split_business.pid";

proxy_cache_path logs/proxy_split_business_cache keys_zone=biz:4m;

upstream app_stable {
    server 127.0.0.1:18373;
    server 127.0.0.1:18374;
    keepalive 32;
}
upstream app_next {
    server 127.0.0.1:18375;
    keepalive 8;
}
upstream app_hotfix {
    server 127.0.0.1:18376;
}
upstream app_grey {
    server 127.0.0.1:18377 max_fails=1 fail_timeout=30s;
}
upstream app_bleed {
    server 127.0.0.1:18378 max_fails=1 fail_timeout=30s;
}

# 声明一：主发布通道，18% 到 app_next，其余 stable。默认档（允许改投）。
split_clients "${cookie_uid}" $app_release {
    18%     app_next;
    *       app_stable;
}

# 声明二：发布阶梯。2% 先落到 hotfix 池，18% 到 next，其余 stable。
split_clients "${cookie_uid}" $ladder_release {
    2%      app_hotfix;
    18%     app_next;
    *       app_stable;
}

# 声明三：灰度实验通道，不许串台。
split_clients "${cookie_uid}" $grey_release {
    20%     app_grey;
    *       app_stable;
}

# 声明四：默认档 + 整路没人，用来演"第一次仍是这一路的失败，摘除期之后才改投"。
split_clients "${cookie_uid}" $bleed_release {
    20%     app_bleed;
    *       app_stable;
}

# 声明五：反面教材——同一个比例，键换成 $remote_addr。
split_clients "${remote_addr}" $addr_release {
    18%     app_next;
    *       app_stable;
}

server {
    listen 127.0.0.1:18372;
    server_name biz.example.test;

    # 用户自己的主页：走缓存，所以命中时"接走请求的那一路"是空串。
    # 归属两路都加成响应头：命中时后端根本没被问，响应头是唯一还能看见归属的地方。
    location /home/ {
        proxy_pass http://$app_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
        proxy_cache biz;
        proxy_cache_valid 200 60s;
        add_header X-Cache $upstream_cache_status;
        add_header X-Split $proxy_split;
        add_header X-Split-Served $proxy_split_served;
    }

    # 未缓存的动态接口：每个请求都必须真的交给一个节点。
    location /api/ {
        proxy_pass http://$app_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 写请求：POST 评论。这一条是整个特性的安全底线所在——
    # 一条评论最多只能送达一个版本，宁可失败也不能写两次。
    location = /write {
        proxy_pass http://$app_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 发布阶梯入口。
    location /ladder/ {
        proxy_pass http://$ladder_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 灰度实验：proxy_split_failover off。
    location /grey/ {
        proxy_pass http://$grey_release;
        proxy_split_failover off;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 默认档 + 死池：比例选中这一路的请求，头一次会拿到这一路自己的失败。
    location /bleed/ {
        proxy_pass http://$bleed_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 键选错的对照。
    location /addr/ {
        proxy_pass http://$addr_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 不参与分流：字面量目标，一分钱不付。
    location = /admin {
        proxy_pass http://app_stable;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
