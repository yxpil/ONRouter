# Author: yxpil
# URI encoding E2E (driven by tools/uri_encode_e2e.py)
# Proves the request line the gateway forwards is the client's target verbatim: characters legal
# inside a path segment (@ : + , ; = & $ ...) are not percent-encoded, while % # ? space and
# non-ASCII are still escaped back.
error_log "logs/uri_encode_err.log" warn;
access_log off;

server {
    listen 127.0.0.1:18290;
    server_name encode.local;

    location /ping { return 200 "pong"; }

    location / {
        proxy_pass "http://127.0.0.1:18291";
    }
}
