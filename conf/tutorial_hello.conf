# 教程第二章：最小可运行配置（只做静态文件与两条 return）。
# 启动：target/release/onrouter -c conf/tutorial_hello.conf
error_log "logs/tutorial_hello_err.log" info;
pid "logs/tutorial_hello.pid";

server {
    listen 127.0.0.1:18600;
    server_name tutorial.local;

    location = /health {
        return 200 "ok";
    }

    location = /hello {
        return 200 "hello from onrouter";
    }

    location / {
        root "../public";
    }
}
