# 缓存学习（TinyLFU 准入/驱逐）E2E：两个容量相同（keys_zone=1k → 8 条）的区，
# 一个声明了 proxy_cache_learning、一个不声明。用同一批一次性 URL 冲刷两侧，
# 只有学习区的热点对象能活下来——这才是"学习"真正解决的问题，不是单测里的数字游戏。
# 网关 18177 / 后端 18176（与套件其它端口错开），见 tools/learning_cache_e2e.py。
error_log "logs/learning_cache_err.log" info;
access_log "logs/learning_cache_access.log";
pid "logs/learning_cache.pid";
reload 200ms;

proxy_cache_path /tmp/onrouter_lc  keys_zone=lc:1k;
proxy_cache_path /tmp/onrouter_lru keys_zone=lru:1k;

learning on;
learning_memory_budget 1m;
proxy_cache_learning lc sketch=64k;

server {
    listen 127.0.0.1:18177;
    server_name learning.local;

    # 就绪探针：不碰后端、不进缓存
    location /ping {
        return 200 "pong";
    }

    # 学习区：一次性 URL 进不来，热对象留在缓存里
    location /lc/ {
        proxy_pass "http://127.0.0.1:18176/";
        proxy_cache lc;
        proxy_cache_valid 200 60s;
    }

    # 对照区：同样 8 条容量，但没声明学习 → 纯 LRU，会被冲刷干净
    location /lru/ {
        proxy_pass "http://127.0.0.1:18176/";
        proxy_cache lru;
        proxy_cache_valid 200 60s;
    }

    location /metrics {
        content_by_rust metrics;
    }
}
