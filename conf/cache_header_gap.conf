# cache_header_gap E2E —— 缓存/响应头语义对齐 nginx：add_header 变量、$upstream_cache_status、
# proxy_cache_bypass/proxy_no_cache 的多值与空值、proxy_ignore_headers。
# 端口 18360，后端由 tools/cache_header_gap_e2e.py 起在 18361。
error_log "logs/gap_err.log" info;
access_log "logs/gap_access.log";

proxy_cache_path /tmp/onrouter_gap keys_zone=gap:1m;

server {
    listen 127.0.0.1:18360;
    server_name gap.local;

    location /ping {
        return 200 "pong";
    }

    # G1 add_header 必须做变量展开：已知变量取值、缺失的 $arg_/$cookie_ 展开为空串
    location /hdr/ {
        add_header X-Addr $remote_addr;
        add_header X-Meth $request_method;
        add_header X-Empty $arg_missing;
        add_header X-Cookie $cookie_missing;
        # 完全不是 nginx 变量的名字：保留字面量，让配置写错在响应里可见
        # （nginx 在解析期就 emerg "unknown \"...\" variable"，这里没有完整的变量白名单）
        add_header X-Unk $no_such_var_xyz;
        return 200 "ok";
    }

    # G2 对照组：变量与字面文本混写时只展开变量部分；$host 去端口、$http_host 保留原样
    location /hdr-lit/ {
        add_header X-Mix "$host/static";
        add_header X-Host $host;
        add_header X-Raw-Host $http_host;
        return 200 "ok";
    }

    # G3 $upstream_cache_status：GET 走缓存，POST 非缓存方法下必须是空串
    location /cs/ {
        proxy_pass http://127.0.0.1:18361;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        add_header X-Cs $upstream_cache_status;
    }

    # G4 proxy_cache_bypass 多值：任一值非空且非 "0" 才跳过读取
    location /bypass2/ {
        proxy_pass http://127.0.0.1:18361;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $arg_a $arg_b;
    }

    # G4b 表达式里含"此刻没有值的变量"：不能因为变量名被当字面量而永远为真
    location /bypass3/ {
        proxy_pass http://127.0.0.1:18361;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_cache_bypass $arg_none $http_x_none;
    }

    # G5 proxy_no_cache 多值 + 空值：只有给 ?nc=1 时才不写入
    location /nocache2/ {
        proxy_pass http://127.0.0.1:18361;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_no_cache $arg_nc;
    }

    # G6 proxy_ignore_headers Cache-Control：上游 no-store 被无视后由 proxy_cache_valid 决定
    location /ignore-cc/ {
        proxy_pass http://127.0.0.1:18361/cc/;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_ignore_headers Cache-Control;
    }

    # G6b 对照：不忽略时上游 no-store 必须拒绝缓存
    location /noignore-cc/ {
        proxy_pass http://127.0.0.1:18361/cc/;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
    }

    # G7 proxy_ignore_headers Set-Cookie：带 Cookie 的上游响应也能缓存
    location /ignore-cookie/ {
        proxy_pass http://127.0.0.1:18361/cookie/;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
        proxy_ignore_headers Set-Cookie;
    }

    # G7b 对照：不忽略时 Set-Cookie 阻断写入
    location /noignore-cookie/ {
        proxy_pass http://127.0.0.1:18361/cookie/;
        proxy_cache gap;
        proxy_cache_key "$scheme$proxy_host$uri";
        proxy_cache_valid 200 60s;
    }
}
