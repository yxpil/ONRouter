# ============================================================
# 业务分流（split_clients → proxy_pass http://$变量）的性能基准专用配置
#   一个 vhost、八条 location，各行的 upstream 形状刻意对齐，唯一变量是"要不要走分流这段代码"：
#     /ps/floor   单节点池 + 字面量 proxy_pass：连"选谁"都没有的形状参照
#     /ps/literal 双节点池 + 字面量 proxy_pass：**这个功能不存在时的成本基线**
#                 （不声明 split、不查全局表、不插值键、不哈希、不碰账本）
#     /ps/lithdr  同上，但多两条定长的上游请求头：把"分流各行必须带归属头"这件事的成本
#                 从分流机制里剥出去（否则 const-literal 混了两个头的写成本）
#     /ps/const   同一个池，但目标写成 http://$psConst，粘性键是常量 "bench"
#                 → 多出来的只有"查 split 表 + 哈希落桶 + 写账本"
#     /ps/hdr     同上，粘性键换成 ${http_x_split_key} → 再多加"每请求展开键模板（查请求头）"
#     /ps/two     两个分支各指一个池（psA / psB），键同上 → 真实业务形状
#     /ps/off     与 /ps/two 完全同形，只多一句 proxy_split_failover off → 证明策略声明本身不进热路径
#   psLit / psA / psB 三个池都是同样两台后端：于是无论比例把请求判给哪一路，
#   两台 Python 后端承接的总请求数与 /ps/literal 完全一致，档与档之间的 rps 差
#   只可能是网关这段代码的成本，不是后端被压垮的程度差。
#   与 bench_least_time.conf 对齐：同一份 access_log、同样的 Python 后端形状。
#   端口 8710（网关）与 9201/9202（后端）与其它套件错开：
#   回归用 18xxx，bench_ab 用 8080+9001/9002，least_time 基准用 8700+9001-9003，
#   front_proxy 基准用 8690-8695。
# ============================================================
error_log "logs/bench_proxy_split_err.log" warn;
pid "logs/bench_proxy_split.pid";
access_log "logs/bench_proxy_split_access.log";

# 形状参照：只有一个节点，选择这回事不存在
upstream psFloor {
    server 127.0.0.1:9201;
}

# 成本基线 / 分流分支共用的"同样两台后端"
upstream psLit {
    server 127.0.0.1:9201;
    server 127.0.0.1:9202;
}
upstream psA {
    server 127.0.0.1:9201;
    server 127.0.0.1:9202;
}
upstream psB {
    server 127.0.0.1:9201;
    server 127.0.0.1:9202;
}

# 常量键：分支全部指向 psLit（去重后只有一个 target），所以这一段只测机制本身
split_clients "bench" $psConst {
    50% psLit;
    *   psLit;
}

# 换成请求头键：把"每请求展开键模板"的成本叠上去
split_clients "${http_x_split_key}" $psHdr {
    50% psLit;
    *   psLit;
}

# 真实形状：两个业务版本各一个池，两个池同样两台后端
split_clients "${http_x_split_key}" $psTwo {
    50% psA;
    *   psB;
}

# 与 $psTwo 完全同形，只是这一路失败时不串台
split_clients "${http_x_split_key}" $psOff {
    50% psA;
    *   psB;
}

server {
    listen 127.0.0.1:8710;
    server_name split-bench.local;

    # 分流的两行把"比例选中的那一路"与"真正接走请求的那一路"转发给后端并打回，
    # 这是脚本判断"这条支路真的跑了"的直接证据（字面量两行刻意不写这两条，
    # 它们本来就没有归属可言）。
    location = /ps/floor {
        proxy_pass http://psFloor/ping;
    }

    location = /ps/literal {
        proxy_pass http://psLit/ping;
    }

    # 归因用的第七行：字面量 proxy_pass，但和分流各行一样多发两条上游请求头。
    # 分流那几行必须带归属头（这是脚本核对"落点账本 vs 网关自己认为在哪一路"的证据来源），
    # 于是 const 与 literal 的差里混着"往上游多写两个头"的成本。这一行把它单独量出来，
    # 剩下的那部分才是分流机制本身。值写成定长串，跟分流各行送出去的长度一致。
    location = /ps/lithdr {
        proxy_pass http://psLit/ping;
        proxy_set_header X-Split psLit;
        proxy_set_header X-Split-Served psLit;
    }

    location = /ps/const {
        proxy_pass http://$psConst/ping;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /ps/hdr {
        proxy_pass http://$psHdr/ping;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /ps/two {
        proxy_pass http://$psTwo/ping;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /ps/off {
        proxy_pass http://$psOff/ping;
        proxy_split_failover off;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
