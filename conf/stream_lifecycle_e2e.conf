# L4 隧道生命周期 E2E：
#   * 命名 upstream 的 max_conns 额度覆盖整条隧道（第二条隧道在建立前即被拒，
#     第一条关闭后额度释放）
#   * 活跃连接/累计接受指标把 L4 连接计入（与 HTTP 同一份 metrics）
#   * Ctrl+Break（Windows 优雅停机）先关闭监听（新连接被拒），再在 shutdown_grace
#     内放行在途隧道，超时后强制断开并由进程正常退出
error_log "logs/stream_lifecycle_err.log" info;
worker_connections 64;
shutdown_grace 3s;

# max_conns=1：四层隧道期间额度必须一直被占用
upstream solo {
    server 127.0.0.1:18264 max_conns=1;
}

stream {
    server {
        listen 127.0.0.1:18263;
        proxy_pass solo;
        proxy_timeout 30s;
    }

    server {
        listen 127.0.0.1:18265;
        proxy_pass 127.0.0.1:18266;
        proxy_timeout 30s;
    }
}

server {
    listen 127.0.0.1:18262;
    server_name lifecycle.local;

    location /metrics {
        content_by_rust metrics;
    }
}
