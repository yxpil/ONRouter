# ============================================================
# ONRouter 网关示例配置（Nginx / OpenResty 风格）
# 演示：upstream 负载均衡、proxy_pass 反代、rewrite、return、
#       正则/精确 location、*_by_lua 脚本、*_by_rust 原生模块、静态文件
# ============================================================

# init 阶段：服务器启动时执行一次（对标 init_by_lua）
init_by_lua "print('onrouter boot: init_by_lua running')";

# Lua 共享内存字典（对标 lua_shared_dict，跨请求共享状态）
lua_shared_dict counters 1m;

# 访问日志（combined 格式）
access_log "logs/access.log";

# ---------- upstream：负载均衡（对标 nginx upstream） ----------
upstream demo_backend {
    server 127.0.0.1:9001 weight=1 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:9002 weight=1 max_fails=2 fail_timeout=5s;
    # 负载均衡策略：默认加权轮询；可选 least_conn / ip_hash
    # max_fails/fail_timeout：被动健康检查（连接失败达阈值后摘除节点）
    #
    # 自适应选点（默认 off，不写就完全不生效、一个原子量都不写）：
    #   least_time observe;   只测量：选点结果与 off 逐字节一致，但每个后端的响应头时延会被量出来，
    #                         /metrics 给出 ewma 与"按分数选会改判多少次"——先拿证据再决定开不开。
    #   least_time on;        按 P2C + 时延 EWMA 选点（每次抽两个候选，取"在途+1 × 实测时延"低的）。
    #                         为什么不是"永远选当前最快的那个"：那会让流量整体涌向 momentarily 最快的
    #                         后端、把它压成最慢的再来回甩。P2C 让被压的节点自己涨分退让。
    #   least_time_window 5s; 多久内的观测还算数。按**时间**衰减（不是按样本数），所以收敛时间与
    #                         QPS 无关；超过 4×窗口没有样本，就当作"不知道它现在多快"重新探测——
    #                         观测只在被选中时发生，否则一个被误判为慢的后端永远没机会澄清自己。
    # 只有成功拿到响应头的请求入样；连接失败/超时的"耗时"是阈值不是后端的快慢，走 max_fails 那套。
    # least_time 与 ip_hash 互斥（ip_hash 已经决定了选点，分数永远不参与），-t 直接拒绝。
    # 证据与断言见 tools/least_time_e2e.py；改过 upstream 段要重启（池不热替换）。
}

# ---------- 前面还有一层 CDN / 反代？在配置里声明，不写进二进制 ----------
# 引擎里没有任何厂商名字：每家前置代理只是 `front_proxy <名字> { probe / ip_header /
# country_header / proto_header / host_header / trust }` 一张声明表，厂商改名、加头、换网段
# 都只改这张表。真实客户端地址的候选头按书写顺序优先（写多条 = 一条链）。
# 硬规则：任何从头部取来的值都要求**直连 TCP 对端**落在 trust ∪ set_real_ip_from 里 ——
# 这些头是任何人都能发的，所以"认出是谁"和"信它"是两件事。
# 先 front_proxy_mode detect;（只标注、零改写，/metrics 能看到到底是谁在来），
# 有了实测依据再升 egress;。可直接抄的 Cloudflare / CloudFront / 自建层三份声明见
#   conf/front_proxy_examples.conf（含回源网段的刷新方式）；行为断言见 conf/front_proxy_e2e.conf。

# ---------- 缓存治理器：流量低时休眠、突发时自动 boost（默认 off，零足迹） ----------
# 速率由进程自己数（尾随 8 个完整秒），进入/退出阈值分离 + 最小驻留时间，抖动的 rps 不会把缓存层来回翻。
# 不写 cache_governor 时：不建任务、不占内存、/metrics 没有 onrouter_governor_* 系列。
#   cache_governor off;       默认值（与不写等价，配置里写出来只为显式）。
#   cache_governor observe;   只测量：相位机与指标都在跑，清扫节奏和数据一个字节不动——先拿证据再开。
#   cache_governor auto;      让相位驱动动作。
#   cache_governor_low 2;     低于 2 rps 才可能入睡；醒来要超过 low × 1.5（回差防抖）。
#   cache_governor_high 20;   连续两个 500ms tick 超过 20 rps 进入 boost；低于 high × 0.8 才退出。
#   cache_governor_hold 60;   任何相位至少停留 60s，限速抖动不能把相位机当节拍器。
#   cache_governor_tier light; 浅睡：后台清扫 60s -> 600s，不搬数据。
#   cache_governor_tier deep;  深睡：带 disk= 的 dict 条目强制落盘回收内存；proxy_cache 按 LRU 驱逐
#                              （配了 disk=on 的区是把还新鲜的响应沉到冷层，没配的就靠回源重建）；
#                              没有 disk= 的 dict 区永远不碰——那是应用状态，不是缓存。
#   cache_governor_learn on;  记录分钟级一天画像（内存态 ≈2.9 KiB），在 lead 秒后通常忙的时段提前 boost。
#   cache_governor_lead 60;   预判提前量；0 = 关闭预判（默认 60s）。
# 完整行为见 conf/governor.conf（auto/deep）与 conf/governor_off.conf（关闭对照），断言见
# tools/governor_e2e.py（真实流量：入睡/唤醒/落盘回收/冷层读回/突发预热/热重载）。

server {
    listen 8080;
    # HTTPS：`listen <port> ssl` + 证书对（用 orr-gencert 生成自签名证书）
    listen 8443 ssl;
    ssl_certificate "../certs/cert.pem";
    ssl_certificate_key "../certs/key.pem";
    server_name localhost;
    root "../public";
    add_header X-Powered-By "ONRouter/1.0.0";

    # --- 精确匹配：内联 Lua（对标 content_by_lua） ---
    location = /hello {
        content_by_lua "ngx.say('Hello from Lua inside ONRouter!') ngx.say('method=', ngx.req.get_method(), ' path=', ngx.req.get_path())";
    }

    # --- Lua 文件 + 异步 ngx.sleep + ngx.ctx 状态 ---
    location /api/time {
        rewrite_by_lua_file "../lua/rewrite_mark.lua";
        content_by_lua_file "../lua/time.lua";
    }

    # --- Lua access 阶段鉴权（对标 access_by_lua） ---
    location /api/protected {
        access_by_lua_file "../lua/auth.lua";
        content_by_lua "ngx.say('welcome, token ok!')";
    }

    # --- 反向代理 + proxy_set_header（对标 proxy_pass） ---
    location /proxy/ {
        proxy_pass http://demo_backend/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10;
    }

    # --- rewrite：/old-xxx -> /new-xxx（last = 内部重定向重匹配） ---
    location /old/ {
        rewrite ^/old/(.*)$ /new/$1 last;
    }
    location /new/ {
        content_by_rust echo "you are now at $uri (rewritten from /old/)";
    }

    # --- return 直接响应（对标 return 指令） ---
    location = /health {
        return 200 "ok";
    }
    location = /jump {
        return 301 http://127.0.0.1:8080/hello;
    }

    # --- 正则 location（对标 location ~ regex） ---
    location ~ ^/user/(\d+)$ {
        content_by_rust echo "user id matched by regex: $uri";
    }

    # --- Rust 原生模块（OpenResty 的 *_by_lua 对应物，编译期注册） ---
    location /api/info {
        content_by_rust info;
    }
    location /api/slow {
        content_by_lua "ngx.sleep(0.1) ngx.say('slept 0.1s asynchronously')";
    }

    # --- 定时器测试：官方 ngx.timer.at/every 语义（秒单位 + premature 首参 + 变参转发）---
    location /api/timer_test {
        content_by_lua "
            local ok, err = ngx.timer.at(0.05, function(premature, s, i)
                print('at fired premature=', premature, ' args=', s, i)
            end, 'hello', 42)
            if not ok then ngx.say('failed to set timer: ', err) return end

            local n = 0
            local ok2, err2 = ngx.timer.every(0.1, function(premature)
                n = n + 1
                print('every tick ', n, ' premature=', premature)
                if n >= 3 then return false end
            end)
            if not ok2 then ngx.say('failed to set every: ', err2) return end

            ngx.say('registered, pending=', ngx.timer.pending_count(), ' running=', ngx.timer.running_count())
        ";
    }

    # --- 定时器错误语义（对标 107-timer-errors.t）---
    location /api/timer_errors {
        content_by_lua "
            local ok1, e1 = ngx.timer.at(-1, function() end)
            local ok2, e2 = ngx.timer.at('x', function() end)
            local ok3, e3 = ngx.timer.at(0.01, 'not a function')
            local ok4, e4 = ngx.timer.every(0, function() end)
            ngx.say(tostring(ok1), ':', tostring(e1))
            ngx.say(tostring(ok2), ':', tostring(e2))
            ngx.say(tostring(ok3), ':', tostring(e3))
            ngx.say(tostring(ok4), ':', tostring(e4))
        ";
    }

    # --- body_filter 测试：修改响应体 ---
    location /api/body_filter_test {
        content_by_lua "ngx.say('Hello World')";
        header_filter_by_lua "ngx.header['Content-Length'] = nil";
        body_filter_by_lua "
            local chunk = ngx.arg[1]
            local eof = ngx.arg[2]
            if chunk then
                -- 将所有 'World' 替换为 'OpenResty'
                local modified = string.gsub(chunk, 'World', 'OpenResty')
                ngx.arg[1] = modified
            end
        ";
    }

    # --- Lua 共享字典 + 原子计数（ngx.shared.DICT） ---
    location = /count {
        content_by_lua "
            local d = ngx.shared.counters
            local n = d:incr('hits', 1, 0)
            ngx.header['Content-Type'] = 'text/plain; charset=utf-8'
            ngx.say('hits=' .. n)
            ngx.say('ttl=' .. tostring(d:ttl('hits')))
        ";
    }

    # --- ngx.redirect 外部重定向 ---
    location = /go {
        content_by_lua "ngx.redirect('/hello', 302)";
    }

    # --- ngx.exec 内部重定向（客户端无感，落回 /hello） ---
    location = /inner {
        content_by_lua "ngx.exec('/hello')";
    }

    # --- ngx.re 正则 + URI 编解码 + POST 请求体读取 ---
    location = /api/tools {
        content_by_lua "
            local m = ngx.re.match(ngx.req.get_path(), '/api/(\\\\w+)')
            ngx.say('re-capture=' .. (m and m[1] or 'nil'))
            ngx.say('escaped=' .. ngx.escape_uri('a b/c?d'))
            ngx.say('unescaped=' .. ngx.unescape_uri('%E4%BD%A0%E5%A5%BD'))
            local body = ngx.req.get_body_data()
            ngx.say('body_len=' .. (body and #body or 0))
        ";
    }

    # --- 静态文件（nginx 语义：alias 把 /static/ 之后的路径映射到 public/） ---
    location /static/ {
        alias "../public/";
    }

    # --- 根路径：首页 ---
    location / {
        root "../public";
    }
}
