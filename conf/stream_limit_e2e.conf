# L4 与 HTTP 共享 worker_connections 额度 E2E：
#   * 一条存活隧道占满额度后，第二条 L4 连接被立即断开（不排队）
#   * 同一时刻的 HTTP 连接拿到 503（快速过载拒绝），证明额度是进程级共享的
#   * 隧道关闭后额度立即归还：L4 与 HTTP 都能恢复正常
worker_connections 1;
error_log "logs/stream_limit_err.log" info;

stream {
    server {
        listen 127.0.0.1:18260;
        proxy_pass 127.0.0.1:18261;
        proxy_timeout 30s;
    }
}

server {
    listen 127.0.0.1:18268;
    server_name limit.local;

    location /ping {
        return 200 "pong";
    }
}
