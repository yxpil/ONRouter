# 限流 key 用请求期变量（$http_/$cookie_/$arg_）——tools/limit_key_e2e.py 的用例配置
#
# 这一份配置要回答的是"按学生号/按会话限流"到底成不成：真实机房出口共用 IP，
# 键取 $remote_addr 时一整栋楼共享同一个令牌桶。全部用例都从 127.0.0.1 发起，
# 于是"换个 key 就换个桶"是可以直接判定的，不依赖时间窗口的运气。

# info：`生效 limit_req zone=… key=…` 那行是这一份配置要读的东西（限流的实际计数维度）
error_log "logs/limit_key_err.log" info;
pid logs/limit_key.pid;
worker_threads 2;

# 按请求头计数：burst=0 → 有令牌才放行，判定最干净
limit_req_zone $http_x_client zone=byhdr:1m   rate=1r/s burst=0;
# 按 Cookie 计数
limit_req_zone $cookie_sid    zone=bycookie:1m rate=1r/s burst=0;
# 按 URL 参数 + 地址拼接计数（nginx 的 complex value 写法）
limit_req_zone $arg_k$remote_addr zone=byarg:1m rate=1r/s burst=0;
# 队列 + 同一个键：救回来的是"这个学生"的后续请求，不是同 IP 的陌生人
limit_req_zone $http_x_client zone=bq:1m      rate=2r/s burst=0;
limit_req_zone $http_x_client zone=bp:1m      rate=2r/s burst=0;
limit_req_queue bq depth=4 depth_min=4 max_delay=3000ms;
# 并发闸同样按头计数（顶层声明，与 nginx 的 http 级一致）
limit_conn_zone $http_x_client zone=cbyhdr:1m;
limit_conn_zone $http_x_client zone=perpath:1m;

upstream lkorigin { server 127.0.0.1:18581; keepalive 8; }

server {
    listen 127.0.0.1:18580;
    server_name limit.key.test;

    location = /ping { return 200 "pong\n"; }

    location /hdr/    { limit_req zone=byhdr;    proxy_pass http://lkorigin; }
    location /cookie/ { limit_req zone=bycookie; proxy_pass http://lkorigin; }
    location /arg/    { limit_req zone=byarg;    proxy_pass http://lkorigin; }

    # 没带头的请求：这一维上没有值 → 本区不限流（nginx 的空 key 语义）
    location /anon/   { limit_req zone=byhdr;    proxy_pass http://lkorigin; }

    # 同 rate：/queue/ 有界排队，/plain/ 超限即拒
    location /queue/  { limit_req zone=bq;       proxy_pass http://lkorigin; }
    location /plain/  { limit_req zone=bp;       proxy_pass http://lkorigin; }
}

# limit_conn 也按头：单独一个 vhost，免得并发用例互相踩彼此的令牌桶
server {
    listen 127.0.0.1:18582;
    server_name conn.limit.key.test;
    limit_conn cbyhdr 2;

    location = /ping { return 200 "pong\n"; }
    location /slow/ { proxy_pass http://lkorigin; }
}

# location 级 limit_conn：写了就整组替换 server 的那一条（合并会让这条路由的额度被上级放宽）
server {
    listen 127.0.0.1:18586;
    server_name locconn.limit.key.test;
    limit_conn cbyhdr 5;

    location = /ping { return 200 "pong"; }
    # 源站侧这条路每次睡 1.2s，好让并发真的重叠
    location /own/ { limit_conn perpath 1; proxy_pass http://lkorigin/slow/; }
    location /inh/ { proxy_pass http://lkorigin/slow/; }
}
