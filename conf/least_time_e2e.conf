# least_time 自适应上游选择 E2E —— 三个故意不同时延的假后端 + 三档（off / observe / on）。
# 这份配置只服务 tools/least_time_e2e.py，不是示例；示例写法在 README 与 conf/onrouter.conf。
#
# 档位是这套设计的关键约束：observe 必须**只测量**，选点结果与 off 逐次一致，
# 运营者先在 /metrics 看到"按分数选会改判多少次、每个后端实测多快"，再决定要不要开 on。
error_log "logs/least_time_e2e_err.log" warn;
pid "logs/least_time_e2e.pid";

upstream ltOff {
    server 127.0.0.1:18471;
    server 127.0.0.1:18472;
    server 127.0.0.1:18473;
}

upstream ltObs {
    least_time observe;
    least_time_window 1s;
    server 127.0.0.1:18471;
    server 127.0.0.1:18472;
    server 127.0.0.1:18473;
}

upstream ltOn {
    least_time on;
    least_time_window 1s;
    server 127.0.0.1:18471;
    server 127.0.0.1:18472;
    server 127.0.0.1:18473;
}

# 失败不入账的证据：18478 没人监听，连接失败只走 max_fails/fail_timeout 降权，
# 它的 EWMA 必须一直是 0（"那次花了 2 秒"是超时阈值，不是后端的快慢）。
upstream ltFail {
    least_time on;
    least_time_window 1s;
    server 127.0.0.1:18471 max_fails=1 fail_timeout=60s;
    server 127.0.0.1:18478 max_fails=1 fail_timeout=60s;
}

server {
    listen 127.0.0.1:18470;
    server_name least-time.local;

    location = /ping {
        content_by_lua "ngx.say('pong')";
    }

    location = /off {
        proxy_pass http://ltOff;
    }

    location = /obs {
        proxy_pass http://ltObs;
    }

    location = /on {
        proxy_pass http://ltOn;
    }

    location = /fail {
        proxy_pass http://ltFail;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
