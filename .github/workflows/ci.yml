name: CI

# 单元测试 + 关键特性 E2E。release.yml 只负责打各类平台的包，不跑测试；
# 这里把"能编译"和"行为正确"分开守住：
#   unit  全量 Rust 单元测试（配置解析、路由、WASM、熔断、缓存、Lua…）
#   e2e   功能契约：灰度 / WASM / 熔断懒重连 / CPU 亲和性 / 业务分流 / 缓存磁盘冷层 /
#         限流键 / expires / 惊群 / 攻击面矩阵 / 多域名单端口 TLS（https_matrix：证书按 SNI、
#         站点按 Host 两本账分开验，兜底证书那条只有它的 18449 组能判别），全部走真实端口和真实后端
#   e2e   业务形状：选课报名、静态站+WASM+Lua、游戏 UDP（第二步）；同一站点 over h1/h2/h3 的跨传输一致性（第三步，需要 orr-h3check 探针）
#   soak  手动触发，20 分钟混合流量并分析进程私有内存趋势（不在每次 push 上烧 20 分钟）
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      soak_minutes:
        description: '额外跑多少分钟稳定性压测（0 = 不跑）'
        required: false
        default: '0'
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  unit:
    name: Rust unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --workspace

      # 仓库里还有历史代码未统一 rustfmt，暂不做 --check 门禁（避免无关的大 diff）；
      # clippy 以默认配置运行：有 error 才失败，warning 作为诊断信息保留。
      - name: Clippy
        run: cargo clippy --workspace --all-targets

  e2e:
    name: Feature E2E
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release gateway
        run: cargo build --release -p onrouter-server --bin onrouter

      - name: Run feature E2E
        run: |
          mkdir -p conf/logs
          for suite in canary wasm resilience affinity proxy_split proxy_disk \
                       limit_key expires herd security_matrix https_matrix tls_groups \
                       uri_encode; do
            echo "::group::${suite}_e2e"
            python3 "tools/${suite}_e2e.py"
            echo "::endgroup::"
          done

      - name: Run business-shape E2E
        run: |
          mkdir -p conf/logs
          for suite in course_selection production_shape game_udp; do
            echo "::group::${suite}_e2e"
            python3 "tools/${suite}_e2e.py"
            echo "::endgroup::"
          done

      - name: Run HTTP/3 + HTTPS business E2E
        # 这条需要 h3 客户端探针（与网关同栈的 quinn+h3），Linux 上同样是自研客户端
        run: |
          mkdir -p conf/logs
          cargo build --release -p onrouter-server --bin orr-h3check
          echo "::group::quic_business_e2e"
          python3 tools/quic_business_e2e.py
          echo "::endgroup::"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: conf/logs/
          if-no-files-found: ignore
          retention-days: 7

  pq:
    name: Post-quantum build (--features pq)
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `pq` 把 aws-lc-sys（C 代码）带进构建：这个作业既是"入向能谈 X25519MLKEM768"的行为验证，
      # 也是这条 Linux 构建链本身的验证（真实动因：已有 CDN 的回源 hello 只含后量子组，
      # 默认构建只能拒绝它 —— 见 docs/OPERATIONS.md §5.6）。
      #
      # 构建发生在 debian:bookworm 容器里，不是 runner 主机上。原因实测过：在 ubuntu-24.04
      # （glibc 2.39）上直接编译 aws-lc 的 C 代码，产物会引用 `GLIBC_2.38` 符号，落到
      # Debian 12（glibc 2.36）这台生产机上直接起不来；同一份默认构建的产物只要求 2.34。
      # 用发布目标系统的 glibc 编译，产物才能既在 CI 主机上跑、也在老发行版上跑。
      - name: Build with pq (inside debian:bookworm, glibc 2.36)
        run: |
          docker run --rm -v "$PWD":/work -w /work debian:bookworm bash -euo pipefail -c '
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends curl ca-certificates build-essential cmake pkg-config perl python3 openssl
            curl --proto "=https" -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            cargo build --release -p onrouter-server --features pq --bin onrouter
            ./target/release/onrouter -V
            chown -R "$(id -u):$(id -g)" target/release
          '

      - name: -V must declare the extra group
        run: |
          out=$(./target/release/onrouter -V)
          echo "$out"
          echo "$out" | grep -q '\[pq=on\]' || { echo "::error::-V 没有报告 pq=on"; exit 1; }
          echo "产物要求的最高 glibc：$(readelf -V ./target/release/onrouter | grep -oE "GLIBC_2\.[0-9]+" | sort -uV | tail -1)"

      # 同一套断言在两种构建下都必须 16/16：套件自己读 -V 决定"单给 ML-KEM 组"该谈成还是该拒。
      - name: TLS group contract on the pq build
        run: |
          mkdir -p conf/logs
          python3 tools/tls_groups_e2e.py

      - name: Upload the pq binary
        uses: actions/upload-artifact@v4
        with:
          name: onrouter-pq-linux-x86_64
          path: target/release/onrouter
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pq-logs
          path: conf/logs/
          if-no-files-found: ignore
          retention-days: 7

  soak:
    name: Stability soak
    if: github.event_name == 'workflow_dispatch' && inputs.soak_minutes != '0'
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release gateway
        run: cargo build --release -p onrouter-server --bin onrouter

      - name: Soak test
        env:
          SOAK_MINUTES: ${{ inputs.soak_minutes }}
        run: |
          mkdir -p conf/logs
          python3 tools/soak_test.py --minutes "$SOAK_MINUTES" | tee soak_console.log

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report
          path: |
            target/soak_report.json
            target/soak_samples.csv
            target/soak_metrics_*.txt
            soak_console.log
            conf/logs/soak_*
          if-no-files-found: ignore
          retention-days: 14
