# 灰度发布（canary）E2E —— 只服务 tools/canary_e2e.py，不是示例配置。
#
# 这份配置要把灰度的边界分开证明，混在一起就证不出是哪条语义在起作用：
#   1) 条件命中：cookie（精确 / 存在）、header（名字大小写不敏感）、arg、
#      UA 正则、操作系统识别，各自都能单独把请求送进灰度版本；
#   2) 第一条命中生效：同时满足 cookie 与 header 条件时，按声明顺序取 cookie 那条；
#   3) 百分比档：未命中任何条件时按粘性键哈希分桶，同一个用户永远同一档；
#   4) default：所有条件与百分比都没选中时回到默认版本；
#   5) 灰度版本整池不可用时：默认改投、off 不串台、显式退路只退到指定版本，
#      并且 $proxy_split / $proxy_split_served 如实说明"选的是谁、实际交给谁"；
#   6) 缓存：每个版本按自己的目标成条目，命中时归属仍看得见（served 为空）。
# info 不是随手写的：灰度那条启动横幅是 info 级，级别调回 warn 就没有可查的横幅了。
error_log "logs/canary_e2e_err.log" info;
pid "logs/canary_e2e.pid";

proxy_cache_path logs/canary_cache keys_zone=canarycache:1m;

# 三个真实版本：谁接的请求会写在响应体与响应头里，脚本据此断言落点
upstream stable {
    server 127.0.0.1:18391;
}
upstream beta {
    server 127.0.0.1:18392;
}
upstream alt {
    server 127.0.0.1:18393;
}
# 三只"先接一脚、再没人可服务"的池：同一个死地址、各自独立的失败计数。
# 不写 `server ... down;`——全 down 的池在 -t 就报错，而运维真实遇到的是
# "第一个请求连接被拒 → 该池进摘除期 → 第二个请求才轮到改投"。
upstream deadAuto {
    server 127.0.0.1:18394 max_fails=1 fail_timeout=60s;
}
upstream deadStrict {
    server 127.0.0.1:18394 max_fails=1 fail_timeout=60s;
}
upstream deadExplicit {
    server 127.0.0.1:18394 max_fails=1 fail_timeout=60s;
}

# ---- 主灰度：条件优先，其次 20% 哈希，最后默认版本 ----
# 粘性键显式写成"用户 cookie + 客户端地址"：同一个用户换网络也还在同一档，
# 而单靠 $remote_addr 会让整个 NAT 后的用户共用一档（见场景里对分布的断言）。
canary $release "${cookie_uid}${remote_addr}" {
    # cookie 精确匹配 / 仅要求存在且非空（空 cookie 不算命中）
    cookie beta=1 beta;
    cookie preview beta;
    # header 名字大小写不敏感；值精确匹配
    header X-Channel=Vip alt;
    # query 参数（名字大小写敏感，与 $arg_* 一致）
    arg ver=beta beta;
    # UA 正则：~* 大小写不敏感；放在 os 前面，所以带 Edg 的 Windows UA 走这条
    ua ~* (Firefox|Edg) beta;
    # 操作系统族：iOS 先于 macOS、Android 先于 Linux（detect_os 的固定顺序）
    os ios beta;
    os windows alt;
    # 条件都没命中时，20% 的用户按粘性键进入 beta
    percent 20 beta;
    default stable;
}

# ---- 本意那一路整池不可用：默认（on）改投到候选顺序的下一路 ----
canary $dead_release "${cookie_uid}${remote_addr}" {
    cookie beta=1 deadAuto;
    percent 30 alt;
    default stable;
}

# 同一形状，但 location 里 proxy_split_failover off：灰度实验不串台
canary $strict_release "${cookie_uid}" {
    cookie beta=1 deadStrict;
    default stable;
}

# 显式退路：只允许退到 alt（alt 必须在这条 canary 声明过的版本里）
canary $explicit_release "${cookie_uid}" {
    cookie beta=1 deadExplicit;
    header X-Channel=Vip alt;
    default stable;
}

server {
    listen 127.0.0.1:18390;
    server_name canary.local;

    # 两个变量随请求头转发给后端，后端原样打回：
    # 这是"网关把请求交给某一路时到底认为自己在哪一路"的直接证据。
    location = /release {
        proxy_pass http://$release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /auto {
        proxy_pass http://$dead_release;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /strict {
        proxy_pass http://$strict_release;
        proxy_split_failover off;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    location = /explicit {
        proxy_pass http://$explicit_release;
        proxy_split_failover http://alt;
        proxy_set_header X-Split $proxy_split;
        proxy_set_header X-Split-Served $proxy_split_served;
    }

    # 灰度变量不只用于主机位：这里目标写死，只把选出的版本作为头转发
    location = /hdr {
        proxy_pass http://stable;
        proxy_set_header X-Release $release;
    }

    # 缓存命中时请求根本没有交给任何节点：$proxy_split 仍然说得出这是哪一路的缓存，
    # $proxy_split_served 则是空串（add_header 遇空值不输出，响应里就看不到这一行）。
    location = /cached {
        proxy_pass http://$release;
        proxy_cache canarycache;
        proxy_cache_valid 200 60s;
        add_header X-Cache $upstream_cache_status;
        add_header X-Split $proxy_split;
        add_header X-Split-Served $proxy_split_served;
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
