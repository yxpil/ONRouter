# 大静态文件流式 E2E —— 证明超过内存缓存阈值的文件不再整份读入进程：
#   * 128MB 文件 200/206/HEAD/304 全部字节级正确；
#   * 客户端暂停读取时服务端 RSS 不随文件大小增长（旧实现持有整份 Vec）；
#   * 大文件 + sub_filter 仍能整份改写（仅 MIME 命中时缓冲）。
access_log "logs/static_stream_access.log";
error_log "logs/static_stream_err.log" info;

server {
    listen 127.0.0.1:18192;
    server_name static-stream.local;
    root "../public_static_stream_e2e";
    index index.html;

    location / {
    }

    # 大文件也能走 sub_filter：仅 text/html 命中时才整份读入内存
    location /filtered/ {
        alias "../public_static_stream_e2e/";
        sub_filter "STATIC_TOKEN" "S_DONE";
        sub_filter_once off;
    }
}
