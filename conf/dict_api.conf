# ngx.shared.DICT 方法面补全 E2E —— 用真实流量证明 Batch 2 新增字典方法可用且语义对齐：
#   force_set / force_add / decr / bump / get_plus / get2 / set_auto / size / len /
#   key_present / get_stale(双返回值 stale)。端口与其它套件错开。
error_log "logs/dict_api_err.log" info;
lua_shared_dict dictbox 64k;

server {
    listen 127.0.0.1:18132;
    server_name dict.local;

    # set_auto / size / len / key_present
    location /basic {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            ngx.say('sa=', tostring(d:set_auto('k1', 'hello')))
            ngx.say('sa2=', tostring(d:set_auto('k2', 'world', 100)))
            ngx.say('present=', tostring(d:key_present('k1')))
            ngx.say('missing=', tostring(d:key_present('zz')))
            ngx.say('len=', tostring(d:len()))
            ngx.say('num=', tostring(d:num()))
            ngx.say('size=', tostring(d:size()))
        ";
    }

    # force_add / force_set
    location /fadd {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            ngx.say('fa1=', tostring(d:force_add('c', '1')))
            ngx.say('fa2=', tostring(d:force_add('c', '9')))
            ngx.say('val=', d:get('c'))
            ngx.say('fs=', tostring(d:force_set('c', '5')))
            ngx.say('val2=', d:get('c'))
        ";
    }

    # incr / decr / bump
    location /count {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            ngx.say('i1=', tostring(d:incr('n', 1, 0)))
            ngx.say('d1=', tostring(d:decr('n', 3)))
            ngx.say('i2=', tostring(d:incr('n', 5)))
            ngx.say('b1=', tostring(d:bump('n', 2)))
            ngx.say('bmissing=', tostring(d:bump('gone')))
        ";
    }

    # get_stale 双返回值
    location /stale {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            d:set('s', 'v', 10)
            local v, stale = d:get_stale('s')
            ngx.say('v=', tostring(v))
            ngx.say('stale=', tostring(stale))
        ";
    }

    # get_plus / get2
    location /plus {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            d:set('p', '42', 50)
            local v, flags = d:get_plus('p')
            ngx.say('pv=', tostring(v))
            ngx.say('pflags=', tostring(flags))
            local val, need, stl, fl, expire = d:get2('p')
            ngx.say('g2v=', tostring(val))
            ngx.say('g2stale=', tostring(stl))
            ngx.say('g2flags=', tostring(fl))
        ";
    }

    # free_space 账目：写入计费 / 覆盖缩小释放 / delete 释放 / exptime=0 永不过期
    location /accounting {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            local cap = d:capacity()
            local f0 = d:free_space()
            d:set('aaa', 'x')
            local f1 = d:free_space()
            d:set('bbb', '0123456789')
            local f2 = d:free_space()
            d:set('bbb', 'y')
            local f3 = d:free_space()
            d:delete('aaa')
            local f4 = d:free_space()
            d:delete('bbb')
            local f5 = d:free_space()
            d:set('t', 'v', 0)
            local ttl0 = d:ttl('t')
            ngx.say('cap=', cap)
            ngx.say('f0=', f0)
            ngx.say('f1=', f1)
            ngx.say('f2=', f2)
            ngx.say('f3=', f3)
            ngx.say('f4=', f4)
            ngx.say('f5=', f5)
            ngx.say('never=', tostring(ttl0 == -1))
        ";
    }

    # add 覆盖已过期项：旧成本必须释放，不能重复计费
    location /expired {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            d:set('e', string.rep('z', 100), -1)
            local present = d:key_present('e')
            local f0 = d:free_space()
            local ok = d:add('e', 'n')
            local f1 = d:free_space()
            local val = d:get('e')
            d:flush_all()
            local f2 = d:free_space()
            ngx.say('present=', tostring(present))
            ngx.say('add=', tostring(ok))
            ngx.say('val=', tostring(val))
            ngx.say('d1=', f1 - f0)
            ngx.say('d2=', f2 - f0)
        ";
    }

    # incr/bump 原地改值：数字位数变化时 used 必须同步
    location /incrspace {
        content_by_lua "
            local d = ngx.shared.dictbox
            d:flush_all()
            d:set('n', '9')
            local f0 = d:free_space()
            d:incr('n', 1)
            local f1 = d:free_space()
            d:incr('n', 90)
            local f2 = d:free_space()
            d:incr('n', -100)
            local f3 = d:free_space()
            ngx.say('g1=', f0 - f1)
            ngx.say('g2=', f1 - f2)
            ngx.say('g3=', f3 - f2)
        ";
    }
}
