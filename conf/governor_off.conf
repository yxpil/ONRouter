# Author: yxpil
# Control instance for tools/governor_e2e.py: no cache_governor directive at all.
# The gateway must expose no onrouter_governor_* series and must not create the
# phase-machine task — defaulting to off leaves no resident overhead.
# Port: 18561 (main instance is 18560).
error_log "logs/governor_off_err.log" info;
pid "logs/governor_off.pid";

server {
    listen 127.0.0.1:18561;
    server_name governor-off.local;

    location = /ping {
        return 200 "pong";
    }

    location = /metrics {
        content_by_rust metrics;
    }
}
