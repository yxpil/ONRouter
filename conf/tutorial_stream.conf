# 教程 §13「四层转发」的可运行示例配置
#
# 三条 TCP/UDP 入口 + 一条按 SNI 分流的隧道。后端地址只是示例：本机跑通需要
# 自己在 18661-18663 / 18671-18672 上起监听（tools/game_udp_e2e.py 里有现成的形状）。

stream {
    server {
        listen 18651;
        ssl_preread on;
        sni_match "a.example.com" 127.0.0.1:18661;
        sni_match "*.example.com" 127.0.0.1:18662;
        proxy_pass 127.0.0.1:18663;
    }

    upstream rooms {
        server 127.0.0.1:18671;
        server 127.0.0.1:18672;
    }

    server {                                     # 心跳/状态上报：只发不等
        listen 18652 udp;
        proxy_pass 127.0.0.1:18671;
        proxy_responses 0;
        proxy_timeout 5s;
    }

    server {                                     # 房间服：一问一答，按会话
        listen 18653 udp;
        proxy_pass rooms;
        proxy_timeout 2s;
        udp_max_sessions 4096;
    }

    server {                                     # 匹配服：一问多答
        listen 18654 udp;
        proxy_pass 127.0.0.1:18672;
        proxy_responses 4;
    }

    server {                                     # 同一端口号上的 TCP，与 UDP 并存
        listen 18652;
        proxy_pass 127.0.0.1:18663;
    }
}

server {
    listen 18655;
    server_name stream.test;
    location = /ping { return 200 "pong"; }
}
